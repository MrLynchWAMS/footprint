<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Climate Impact — Carbon Footprint Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-dark: #1a4a2e;
            --green-mid: #2d6e47;
            --green-bright: #3aaa64;
            --green-light: #b6f0cd;
            --green-pale: #eafaf1;
            --ink: #111816;
            --ink-soft: #3d5247;
            --muted: #7a9487;
            --border: #d4e8dc;
            --white: #ffffff;
            --surface: #f5faf7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px 48px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(58,170,100,0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 100%, rgba(26,74,46,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .app {
            width: 100%;
            max-width: 720px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 20px 60px -10px rgba(26,74,46,0.12);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        /* HEADER */
        .header {
            background: var(--green-dark);
            padding: 26px 36px 22px;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            right: -40px; bottom: -40px;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(58,170,100,0.08);
        }
        .header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.75rem;
            color: var(--white);
            display: flex; align-items: center; gap: 10px;
        }
        .header h1 em { color: var(--green-bright); font-style: normal; }
        .header p { font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-top: 4px;
            letter-spacing: 0.07em; text-transform: uppercase; font-weight: 500; }
        /* PROGRESS */
        .progress-wrap { background: rgba(255,255,255,0.1); height: 3px; }
        .progress-bar { height: 3px; background: var(--green-bright); transition: width 0.4s ease; }
        .progress-label {
            background: var(--green-dark);
            padding: 7px 36px;
            font-size: 0.71rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cat-pill {
            background: rgba(58,170,100,0.18);
            color: var(--green-bright);
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 0.68rem;
            letter-spacing: 0.04em;
        }
        /* CONTENT */
        .content { padding: 32px 36px 26px; min-height: 420px; display: flex; flex-direction: column; }
        /* INTRO */
        .intro-icon {
            width: 76px; height: 76px;
            background: var(--green-pale);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 22px;
            border: 2px solid var(--green-light);
        }
        .intro h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem; color: var(--ink);
            text-align: center; margin-bottom: 12px;
        }
        .intro p {
            color: var(--ink-soft); text-align: center;
            line-height: 1.65; font-size: 0.94rem;
            max-width: 500px; margin: 0 auto 28px;
        }
        .btn-primary {
            background: var(--green-dark); color: var(--white);
            border: none; padding: 15px 32px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem; font-weight: 700;
            cursor: pointer;
            transition: background 0.18s, transform 0.15s;
            display: inline-flex; align-items: center; gap: 8px;
            width: 100%; justify-content: center;
        }
        .btn-primary:hover { background: var(--green-mid); transform: translateY(-1px); }
        .divider {
            text-align: center; color: var(--muted);
            font-size: 0.72rem; letter-spacing: 0.08em;
            text-transform: uppercase; font-weight: 600;
            margin: 20px 0; position: relative;
        }
        .divider::before, .divider::after {
            content: ''; position: absolute;
            top: 50%; width: calc(50% - 65px);
            height: 1px; background: var(--border);
        }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .sample-btns { display: flex; gap: 10px; }
        .btn-sample {
            flex: 1;
            background: var(--surface); color: var(--ink-soft);
            border: 1.5px solid var(--border);
            padding: 11px 14px; border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all 0.18s;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .btn-sample:hover { border-color: var(--green-bright); background: var(--green-pale); color: var(--green-dark); }
        /* QUESTION */
        .q-num { font-size: 0.71rem; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
        .q-title { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--ink); line-height: 1.3; margin: 6px 0 8px; }
        .q-desc { font-size: 0.87rem; color: var(--ink-soft); line-height: 1.55; }
        /* OPTIONS */
        .options-list { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
        .option-btn {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: 12px; padding: 13px 16px;
            cursor: pointer; display: flex; align-items: center; gap: 13px;
            transition: all 0.16s;
            font-family: 'DM Sans', sans-serif; text-align: left; width: 100%;
        }
        .option-btn:hover { border-color: var(--green-bright); background: var(--green-pale); }
        .option-btn.selected { border-color: var(--green-dark); background: var(--green-pale); box-shadow: 0 0 0 3px rgba(58,170,100,0.15); }
        .opt-icon {
            width: 38px; height: 38px; border-radius: 9px;
            background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
            transition: background 0.16s;
            line-height: 1;
        }
        .option-btn.selected .opt-icon { background: var(--green-bright); }
        .opt-text { font-size: 0.91rem; font-weight: 500; color: var(--ink); }
        .option-btn.selected .opt-text { color: var(--green-dark); font-weight: 700; }
        /* SLIDER */
        .slider-display {
            background: var(--green-pale); border: 1.5px solid var(--green-light);
            border-radius: 14px; padding: 18px 20px; text-align: center; margin: 14px 0 18px;
        }
        .slider-val { font-family: 'DM Serif Display', serif; font-size: 2.8rem; color: var(--green-dark); line-height: 1; }
        .slider-unit { font-size: 0.84rem; color: var(--muted); margin-top: 3px; font-weight: 500; }
        .slider-impact {
            font-size: 0.77rem; color: var(--ink-soft); margin-top: 8px;
            background: rgba(255,255,255,0.75); padding: 4px 12px;
            border-radius: 99px; display: inline-block; font-weight: 600;
        }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { height: 6px; background: var(--border); border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 28px; height: 28px;
            border-radius: 50%; background: var(--green-dark);
            margin-top: -11px;
            box-shadow: 0 2px 8px rgba(26,74,46,0.3);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.12); }
        .slider-minmax { display: flex; justify-content: space-between; font-size: 0.71rem; color: var(--muted); margin-top: 5px; font-weight: 600; }
        /* RUNNING TOTAL */
        .running-total {
            background: var(--ink); color: var(--white);
            border-radius: 10px; padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 16px; font-size: 0.81rem;
        }
        .rt-left { color: rgba(255,255,255,0.5); font-weight: 500; display: flex; align-items: center; gap: 7px; }
        .rt-icon { font-size: 0.95rem; }
        .rt-val { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--green-bright); }
        /* NAV */
        .nav-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border);
            gap: 10px;
        }
        /* Back button — pill ghost */
        .btn-back {
            display: inline-flex; align-items: center; gap: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.16s;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; font-weight: 600;
            color: var(--ink-soft);
            min-width: 96px;
        }
        .btn-back:hover { border-color: var(--green-bright); color: var(--green-dark); background: var(--green-pale); }
        .btn-back-arrow {
            display: flex; align-items: center; justify-content: center;
            width: 38px; height: 44px;
            background: rgba(0,0,0,0.04);
            border-right: 1px solid var(--border);
            font-size: 1rem; flex-shrink: 0;
            transition: background 0.16s;
        }
        .btn-back:hover .btn-back-arrow { background: rgba(58,170,100,0.1); border-color: var(--green-light); }
        .btn-back-label { padding: 0 14px 0 10px; }
        /* Next button — solid */
        .btn-next {
            display: inline-flex; align-items: center; gap: 0;
            background: var(--green-dark); color: var(--white);
            border: 1.5px solid transparent;
            border-radius: 10px;
            padding: 0;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.16s;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem; font-weight: 700;
            flex: 1;
        }
        .btn-next:hover:not(:disabled) { background: var(--green-mid); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,74,46,0.22); }
        .btn-next:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
        .btn-next-label { flex: 1; text-align: center; padding: 13px 16px; }
        .btn-next-arrow {
            display: flex; align-items: center; justify-content: center;
            width: 42px; height: 100%;
            background: rgba(255,255,255,0.1);
            border-left: 1px solid rgba(255,255,255,0.15);
            font-size: 1rem;
            flex-shrink: 0;
        }
        .btn-next:disabled .btn-next-arrow { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.08); }
        /* RESULTS */
        .results-score { text-align: center; padding: 24px 0 18px; }
        .score-number { font-family: 'DM Serif Display', serif; font-size: 4.5rem; line-height: 1; }
        .score-unit { font-size: 0.88rem; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 4px; }
        .score-mood { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
        .results-section { margin-bottom: 22px; }
        .section-title {
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 11px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
        .fact-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 13px;
            display: flex; align-items: flex-start; gap: 11px;
        }
        .fact-em { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; line-height: 1; }
        .fact-card strong { font-size: 0.78rem; font-weight: 800; display: block; color: var(--ink); margin-bottom: 2px; }
        .fact-card span { font-size: 0.74rem; color: var(--ink-soft); line-height: 1.4; }
        .cmp-row { margin-bottom: 13px; }
        .cmp-labels { display: flex; justify-content: space-between; font-size: 0.74rem; font-weight: 700; margin-bottom: 5px; }
        .cmp-track { background: var(--border); border-radius: 99px; height: 10px; overflow: hidden; }
        .cmp-fill { height: 10px; border-radius: 99px; }
        .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
        .cat-name { font-size: 0.8rem; font-weight: 700; width: 135px; flex-shrink: 0; color: var(--ink-soft); }
        .cat-track { flex: 1; background: var(--border); border-radius: 99px; height: 8px; overflow: hidden; }
        .cat-fill { height: 8px; border-radius: 99px; }
        .cat-val { font-size: 0.74rem; font-weight: 800; color: var(--ink); width: 48px; text-align: right; flex-shrink: 0; }
        .reflection-box {
            background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
            border-radius: 14px; padding: 20px; color: var(--white); margin-bottom: 22px;
        }
        .reflection-box h3 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; margin-bottom: 8px; }
        .reflection-box p { font-size: 0.82rem; opacity: 0.85; line-height: 1.6; }
        .reflection-box ul { padding-left: 18px; margin-top: 8px; }
        .reflection-box ul li { font-size: 0.81rem; opacity: 0.85; line-height: 1.75; }
        .tips-list { display: flex; flex-direction: column; gap: 8px; }
        .tip-item {
            background: var(--surface); border: 1px solid var(--border);
            border-left: 3px solid var(--green-bright);
            border-radius: 8px; padding: 10px 13px;
            font-size: 0.82rem; color: var(--ink-soft); line-height: 1.5;
        }
        .tip-item strong { color: var(--ink); }
        .results-actions { display: flex; gap: 10px; margin-top: 4px; }
        .btn-restart {
            flex: 1; background: var(--surface); border: 1.5px solid var(--border);
            color: var(--ink-soft); border-radius: 10px;
            padding: 13px; font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; font-weight: 600;
            cursor: pointer; transition: all 0.18s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-restart:hover { border-color: var(--green-bright); background: var(--green-pale); color: var(--green-dark); }
        .btn-submit {
            flex: 2; background: var(--green-dark); color: var(--white);
            border: 1.5px solid transparent; border-radius: 10px;
            padding: 13px; font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: all 0.18s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover:not(:disabled) { background: var(--green-mid); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,74,46,0.2); }
        .btn-submit:disabled { cursor: not-allowed; transform: none; opacity: 0.85; }
        .btn-submit.done { background: #059669; }
        .profile-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 13px; border-radius: 99px;
            font-size: 0.74rem; font-weight: 700; margin-bottom: 10px;
        }
        .badge-inf { background: #f3e8ff; color: #7c3aed; }
        .badge-eco { background: var(--green-pale); color: var(--green-dark); }
        .fade-in { animation: fadeUp 0.32s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        @media(max-width:600px){
            .content{padding:22px 18px 18px;}
            .header{padding:18px 18px 16px;}
            .header h1{font-size:1.4rem;}
            .facts-grid{grid-template-columns:1fr;}
            .q-title{font-size:1.28rem;}
            .sample-btns{flex-direction:column;}
            .results-actions{flex-direction:column;}
            .progress-label{padding:7px 18px;}
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🌿 My <em>Climate</em> Impact</h1>
        <p>8th Grade Carbon Footprint Audit</p>
    </div>
    <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressLabel" style="display:none">
        <span id="progressText">Question 1</span>
        <span class="cat-pill" id="catPill">Food</span>
    </div>
    <div class="content" id="content"></div>
</div>
<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
// BASELINE (2200 lbs = 1.1 tons) represents shared household infrastructure
// (water heating, shared lighting, internet router, etc.) per person in a
// typical US home. It is ONLY added to the FINAL score, not the running ticker.
const BASELINE = 2200;

// ═══════════════════════════════════════════════
// QUESTIONS
// icon = emoji (no CDN dependency)
// ═══════════════════════════════════════════════
const questions = [
    // ── FOOD
    {
        id:'qMeatRed', category:'Food', type:'slider', icon:'🍔',
        title:'How many meals a week include red meat?',
        desc:'Beef and lamb are extremely carbon-intensive — cattle produce methane and require massive land use. Think burgers, steaks, beef tacos, and ground beef in pasta.',
        min:0, max:14, default:4, unit:'meals / week',
        // Beef ≈ 27 kg CO₂e/kg protein. Typical serving ≈ 0.25 lb meat ≈ 6.6 lbs CO₂e/meal × 52 wks ≈ 343 lbs/yr per weekly meal.
        multiplier:340,
        impactText: v => v===0 ? 'Zero impact! ✓' : `≈ ${Math.round(v*340).toLocaleString()} lbs CO₂/yr`
    },
    {
        id:'qMeatOther', category:'Food', type:'slider', icon:'🍗',
        title:'How many meals a week include chicken, pork, or fish?',
        desc:'These have a much smaller footprint than beef but still higher than plants. Includes chicken sandwiches, fish tacos, pork chops, deli meat, etc.',
        min:0, max:21, default:7, unit:'meals / week',
        // Chicken ≈ 6.9 kg CO₂e/kg. Serving ≈ 0.25 lb → 0.78 lbs/meal × 52 ≈ 41 lbs/yr per weekly meal.
        multiplier:41,
        impactText: v => v===0 ? 'Zero impact! ✓' : `≈ ${Math.round(v*41).toLocaleString()} lbs CO₂/yr`
    },
    {
        id:'qDairy', category:'Food', type:'options', icon:'🥛',
        title:'How much dairy do you consume?',
        desc:'Milk, cheese, yogurt, butter, and ice cream all come from cows. Dairy is a major hidden carbon source in many diets.',
        options:[
            {text:'None — I use oat milk or other plant-based alternatives',  icon:'🌱', value:0},
            {text:'A little — occasional cheese or yogurt',                    icon:'🧀', value:300},
            {text:'Moderate — daily milk and regular cheese use',              icon:'🥛', value:750},
            {text:'A lot — ice cream, milkshakes, cheese on everything',       icon:'🍦', value:1400}
        ]
    },
    {
        id:'qFoodWaste', category:'Food', type:'options', icon:'🗑️',
        title:'How much food gets wasted at your house?',
        desc:'Food rotting in landfills produces methane, a greenhouse gas 80× more potent than CO₂ in the short term. The US wastes 30–40% of all food produced.',
        options:[
            {text:'Almost none — we eat leftovers and compost scraps',     icon:'♻️', value:0},
            {text:'A little — some stuff occasionally goes bad',            icon:'🍎', value:250},
            {text:'A fair amount — leftovers often get tossed',            icon:'🗑️', value:600},
            {text:'A lot — food gets thrown away nearly every day',        icon:'🔥', value:1100}
        ]
    },
    {
        id:'qTakeout', category:'Food', type:'slider', icon:'🛵',
        title:'How many times a week do you get takeout or food delivery?',
        desc:'DoorDash, Uber Eats, etc. require a dedicated car trip just for your food, plus single-use containers, bags, and utensils.',
        min:0, max:10, default:2, unit:'deliveries / week',
        // Delivery: avg 3-mile round trip for a car ≈ 3 lbs CO₂ + packaging ~1.5 lbs = ~4.5 lbs/delivery × 52 ≈ 234 lbs per weekly delivery.
        multiplier:230,
        impactText: v => v===0 ? 'Zero impact! ✓' : `≈ ${Math.round(v*230).toLocaleString()} lbs CO₂/yr`
    },
    {
        id:'qCaffeine', category:'Food', type:'options', icon:'☕',
        title:"What's your coffee or boba tea habit?",
        desc:'Daily drive-through runs involve dairy, disposable cups and lids, a car trip, and global supply chains. A homemade tea with a reusable mug is much lower impact.',
        options:[
            {text:"I don't drink coffee, boba, or specialty drinks",              icon:'🚫', value:0},
            {text:'Home-brewed coffee or tea with a reusable mug',               icon:'🫖', value:50},
            {text:'Occasional coffee shop or drive-through (a few times a week)', icon:'🚗', value:200},
            {text:'Daily Starbucks, Dutch Bros, boba, or similar order',          icon:'☕', value:650}
        ]
    },
    // ── TRANSPORTATION
    {
        id:'qCarType', category:'Transportation', type:'options', icon:'🚗',
        title:'When you ride in a car, what type is it usually?',
        desc:'Vehicle type matters enormously. A large SUV or truck can burn 2–3× the fuel of a small sedan. An EV has far lower emissions even accounting for the electricity grid.',
        options:[
            {text:'Full Electric Vehicle (EV)',                                          icon:'⚡', value:-400},
            {text:'Plug-in Hybrid (PHEV)',                                               icon:'🔋', value:-150},
            {text:'Regular Hybrid (like a Prius)',                                       icon:'🍃', value:0},
            {text:'Small or midsize sedan or SUV (Civic, Camry, RAV4)',                  icon:'🚗', value:400},
            {text:'Large SUV, Minivan, or Pickup Truck (Tahoe, F-150, Odyssey)',         icon:'🚛', value:1100}
        ]
    },
    {
        id:'qCommuteMethod', category:'Transportation', type:'options', icon:'🏫',
        title:'How do you usually get to school?',
        desc:'Your daily commute happens ~180 days per year. The method makes a massive cumulative difference.',
        options:[
            {text:'Walk or pedal bike',                          icon:'🚲', value:0},
            {text:'E-bike or electric scooter',                  icon:'⚡', value:60},
            {text:'School bus (shared with many students)',       icon:'🚌', value:280},

let step = -1;

// ══════════════════════════════════════════════════════
// SCORE CALCULATION  (used for final results only)
// BASELINE is added here, not in the running ticker.
// ══════════════════════════════════════════════════════
function calculateScore() {
    const ctx = buildCtx(questions.length - 1);
    let total = BASELINE;
    const cats = {Food:0, Transportation:0, 'Housing & Energy':0, Consumerism:0};
    const report = [];
    for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const ans = answers[i];
        if (ans === null) continue;
        const {pts, ansText} = scorePts(q, ans, ctx);
        total += pts;
        cats[q.category] = (cats[q.category] || 0) + pts;
        report.push({questionId:q.id, questionTitle:q.title, category:q.category, answerGiven:ansText, carbonLbsAdded:pts});
    }
    total = Math.max(total, 500);
    return {total, cats, report};
}

// ══════════════════════════════════════════════════════
// RUNNING TICKER  (no BASELINE — shows only the impact
// of choices answered so far, starting at 0.0)
// ══════════════════════════════════════════════════════
function getRunningTotal() {
    const ctx = buildCtx(step);
    let total = 0;
    for (let i = 0; i <= step; i++) {
        const q = questions[i];
        const ans = answers[i];
        if (ans === null) continue;
        total += scorePts(q, ans, ctx).pts;
    }
    return (Math.max(total, 0) / 2000).toFixed(1);
}

// ── Shared context (car type + commute method) up to a given step limit
function buildCtx(maxStep) {
    const ciIdx = questions.findIndex(q => q.id === 'qCommuteMethod');
    const ctIdx = questions.findIndex(q => q.id === 'qCarType');
    const commuteMethod = (maxStep >= ciIdx && answers[ciIdx] !== null) ? answers[ciIdx] : null;
    const carTypeAns    = (maxStep >= ctIdx && answers[ctIdx] !== null) ? answers[ctIdx] : null;
    const carScaleMap = {0:0.3, 1:0.5, 2:0.65, 3:1.0, 4:1.7};
    const carScale = carTypeAns !== null ? (carScaleMap[carTypeAns] ?? 1.0) : 1.0;
    return {commuteMethod, carScale};
}

// ── Score a single question given its answer and context
function scorePts(q, ans, ctx) {
    let pts = 0, ansText = '';
    if (q.type === 'options') {
        pts = q.options[ans].value;
        ansText = q.options[ans].text;
    } else if (q.type === 'slider') {
        ansText = `${ans} ${q.unit}`;
        if (q.id === 'qCommuteDist') {
            // Scale by both commute method and car type
            const methodImpact = [0, 0.05, 0.25, 0.40, 0.55, 1.0];
            const cm = ctx.commuteMethod;
            const distScale = cm !== null ? (methodImpact[cm] ?? 1.0) : 1.0;
            pts = Math.round(ans * 320 * distScale * (cm >= 3 ? ctx.carScale : 1));
        } else if (q.id === 'qWeekendCar') {
            pts = Math.round(ans * 180 * ctx.carScale);
        } else if (q.id === 'qCups') {
            // First 2 cups = eco-positive (replace plastic). Each beyond 2 = 20 lbs.
            pts = Math.max(0, (ans - 2)) * 20;
        } else {
            pts = ans * q.multiplier;
        }
    }
    return {pts, ansText};
}

function startQuiz() {
    step = 0;
    answers = new Array(questions.length).fill(null);
    // Pre-fill slider defaults so Next is always enabled on slider questions
    questions.forEach((q, i) => { if (q.type === 'slider') answers[i] = q.default; });
    renderQuestion();
}

function runProfile(type) {
    answers = type === 'influencer' ? [...influencerProfile] : [...ecoProfile];
    renderResults(type);
}

// ══════════════════════════════════════════════════════
// RENDER: QUESTION
// ══════════════════════════════════════════════════════
function renderQuestion() {
    const q   = questions[step];
    const pct = (step / questions.length) * 100;
    $progressWrap.style.display = 'block';
    $progressLbl.style.display  = 'flex';
    $progressBar.style.width    = `${pct}%`;
    $progressTxt.textContent    = `Question ${step + 1} of ${questions.length}`;
    $catPill.textContent        = q.category;

    const ans = answers[step];
    let inputHtml = '';

    if (q.type === 'options') {
        inputHtml = `<div class="options-list">
            ${q.options.map((opt, i) => `
            <button class="option-btn ${ans === i ? 'selected' : ''}" onclick="selectOption(${i})">
                <div class="opt-icon">${opt.icon}</div>
                <span class="opt-text">${opt.text}</span>
            </button>`).join('')}
        </div>`;
    } else {
        const val = (ans !== null ? ans : q.default);
        inputHtml = `
        <div class="slider-display">
            <div class="slider-val" id="sliderVal">${val}</div>
            <div class="slider-unit">${q.unit}</div>
            <div class="slider-impact" id="sliderImpact">${q.impactText(val)}</div>
        </div>
        <input type="range" min="${q.min}" max="${q.max}" step="1" value="${val}" oninput="onSlider(this.value)">
        <div class="slider-minmax"><span>${q.min}</span><span>${q.max}</span></div>`;
    }

    const canGo = answers[step] !== null;
    const isLast = step === questions.length - 1;
    const ticker = getRunningTotal();

    $content.innerHTML = `
    <div class="fade-in" style="display:flex;flex-direction:column;height:100%">
        <div style="margin-bottom:16px">
            <div class="q-num">Question ${step+1} / ${questions.length} &mdash; ${q.category}</div>
            <h2 class="q-title">${q.icon} ${q.title}</h2>
            <p class="q-desc">${q.desc}</p>
        </div>
        <div style="flex:1">${inputHtml}</div>
        <div class="running-total">
            <span class="rt-left"><span class="rt-icon">📊</span>Your choices so far add</span>
            <span class="rt-val" id="rtVal">${ticker} tons CO₂/yr</span>
        </div>
        <div class="nav-row">
            <button class="btn-back" onclick="prevQ()" ${step===0 ? 'style="visibility:hidden"' : ''}>
                <span class="btn-back-arrow">&#8592;</span>
                <span class="btn-back-label">Back</span>
            </button>
            <button class="btn-next" onclick="nextQ()" id="nextBtn" ${!canGo ? 'disabled' : ''}>
                <span class="btn-next-label">${isLast ? 'See My Results' : 'Next'}</span>
                <span class="btn-next-arrow">${isLast ? '✓' : '&#8594;'}</span>
            </button>
        </div>
    </div>`;
}

function onSlider(val) {
    answers[step] = parseInt(val);
    document.getElementById('sliderVal').textContent    = val;
    document.getElementById('sliderImpact').textContent = questions[step].impactText(parseInt(val));
    document.getElementById('rtVal').textContent        = `${getRunningTotal()} tons CO₂/yr`;
    const btn = document.getElementById('nextBtn');
    if (btn) btn.disabled = false;
}

function selectOption(i) { answers[step] = i; renderQuestion(); }
function prevQ() { if (step > 0) { step--; renderQuestion(); } }
function nextQ() {
    if (answers[step] === null) return;
    if (step < questions.length - 1) { step++; renderQuestion(); }
    else renderResults('user');
}

// ══════════════════════════════════════════════════════

    const {total, cats, report} = calculateScore();

    const globalPct = (4.5  / scaleMax * 100).toFixed(1);
    const usPct     = (15   / scaleMax * 100).toFixed(1);

    const earths    = (tons / 4.5).toFixed(1);
    const trees     = Math.round(tons * 41).toLocaleString();
    const carMiles  = Math.round(tons * 2481).toLocaleString();
    const sharks    = Math.max(1, Math.round(tons * 0.44)).toLocaleString();

    const scoreColor = tons < 8 ? '#3aaa64' : tons < 13 ? '#f59e0b' : '#ef4444';
    const scoreMood  = tons < 8 ? 'Below average — strong habits!' : tons < 13 ? 'Around the US teen average' : 'Above average — big room to improve';

    const catColors = {Food:'#3aaa64', Transportation:'#f59e0b', 'Housing & Energy':'#60a5fa', Consumerism:'#c084fc'};
    const catMax = Math.max(...Object.values(cats), 1);

    const tipMap = {
        Food:[
            '<strong>Swap one beef meal per week</strong> for chicken, beans, lentils, or tofu. This single change saves ~340 lbs CO₂ per year.',
            '<strong>Reduce food waste</strong> by planning meals, storing produce correctly, and eating leftovers. Nearly 40% of all food in the US is wasted.',
            '<strong>Try plant-based milk</strong> like oat milk. Oat milk produces ~80% less CO₂ than cow\'s milk, and most people can\'t taste a difference in smoothies or cereal.'
        ],
        Transportation:[
            '<strong>Walk or bike to school</strong> even once a week. Over a school year, that replaces ~36 car trips.',
            '<strong>Combine car trips</strong> when running errands — multiple short separate trips produce far more emissions than one efficient route.',
            '<strong>Talk to your family</strong> about the next car purchase being a hybrid or EV. That switch can cut transportation emissions by 50–70%.'
        ],
        'Housing & Energy':[
            '<strong>Unplug chargers and power strips</strong> when not in use. "Vampire power" accounts for roughly 10% of home electricity use.',
            '<strong>Use fans instead of AC</strong> on mild days — ceiling fans use ~98% less energy than central air conditioning.',
            '<strong>Shorten showers by 2 minutes</strong> and use cold water for laundry. Water heating is a major energy consumer in most homes.'
        ],
        Consumerism:[
            '<strong>Buy secondhand</strong> for clothing and shoes. Thrift stores, Depop, Poshmark, and Facebook Marketplace are all great and often cheaper.',
            '<strong>Resist the trend cycle.</strong> Ten Stanleys defeats their eco purpose. Buy one, use it for years, and resist the urge to "collect" sustainability products.',
            '<strong>Keep your phone longer.</strong> Going from a 1-year to a 3-year upgrade cycle cuts your phone-related carbon footprint by 66%.'
        ]
    };
    const tips = tipMap[maxCat] || tipMap.Food;

    const badge = profileType === 'influencer'
        ? `<div style="text-align:center;margin-bottom:10px"><span class="profile-badge badge-inf">📱 Profile: The Influencer</span></div>`
        : profileType === 'eco'
        ? `<div style="text-align:center;margin-bottom:10px"><span class="profile-badge badge-eco">🌿 Profile: The Eco-Teen</span></div>`
        : '';

    $content.innerHTML = `
    <div class="fade-in">
        ${badge}
        <div class="results-score">
            <div class="score-number" style="color:${scoreColor}">${tons}</div>
            <div class="score-unit">tons of CO₂ per year</div>
            <div class="score-mood">${scoreMood}</div>
        </div>

        <div class="results-section">
            <div class="section-title">What does ${tons} tons look like?</div>
            <div class="facts-grid">
                <div class="fact-card">
                    <span class="fact-em">🦈</span>
                    <div><strong>Weight</strong><span>Your annual emissions weigh as much as <b>${sharks} Great White Sharks</b> (avg 2,400 lbs each).</span></div>
                </div>
                <div class="fact-card">
                    <span class="fact-em">🌳</span>
                    <div><strong>Trees Needed</strong><span>It takes <b>${trees} mature trees</b> a full year to absorb this much CO₂.</span></div>
                </div>
                <div class="fact-card">
                    <span class="fact-em">🚗</span>
                    <div><strong>Driving Equivalent</strong><span>Equals driving a gas car <b>${carMiles} miles</b> (EPA figure).</span></div>
                </div>
                <div class="fact-card">
                    <span class="fact-em">🌍</span>
                    <div><strong>Planet Pressure</strong><span>If everyone lived this way, we'd need <b>${earths} Earths</b> to absorb the carbon safely.</span></div>
                </div>
            </div>
        </div>

        <div class="results-section">
            <div class="section-title">Global Comparison</div>
            <div class="cmp-row">
                <div class="cmp-labels"><span style="color:var(--muted)">🌐 Global average (sustainability target)</span><span style="color:var(--muted)">4.5 tons</span></div>
                <div class="cmp-track"><div class="cmp-fill" style="width:${globalPct}%;background:#3aaa64"></div></div>
            </div>
            <div class="cmp-row">
                <div class="cmp-labels"><span style="color:var(--muted)">🇺🇸 Average US teenager</span><span style="color:var(--muted)">~15 tons</span></div>
                <div class="cmp-track"><div class="cmp-fill" style="width:${usPct}%;background:#f59e0b"></div></div>
            </div>
            <div class="cmp-row">
                <div class="cmp-labels"><span style="color:${scoreColor};font-weight:800">⬤ You</span><span style="color:${scoreColor};font-weight:800">${tons} tons</span></div>
                <div class="cmp-track"><div class="cmp-fill" style="width:${userPct}%;background:${scoreColor}"></div></div>
            </div>
        </div>

        <div class="results-section">
            <div class="section-title">Breakdown by Category</div>
            ${Object.entries(cats).map(([cat, val]) => {
                const t = (val / 2000).toFixed(2);
                const w = ((val / catMax) * 100).toFixed(1);
                return `<div class="cat-row">
                    <span class="cat-name">${cat}</span>
                    <div class="cat-track"><div class="cat-fill" style="width:${w}%;background:${catColors[cat]}"></div></div>
                    <span class="cat-val">${t}t</span>
                </div>`;
            }).join('')}
            <p style="font-size:0.72rem;color:var(--muted);margin-top:8px;font-style:italic">Note: scores include a 1.1-ton baseline for shared household infrastructure (water heating, shared lighting, internet) that is split among all household members.</p>
        </div>

        <div class="reflection-box">
            <h3>📝 For Your Written Reflection</h3>
            <p>Your highest-emitting category is <strong>${maxCat}</strong>. Use these questions to guide your writing:</p>
            <ul>
                <li>Why do you think <em>${maxCat}</em> is your biggest impact area?</li>
                <li>Which specific answer surprised you the most, and why?</li>
                <li>Name one habit you could realistically change in the next month.</li>
                <li>Why is reducing a personal carbon footprint difficult, even when people genuinely care?</li>
            </ul>
        </div>

        <div class="results-section">
            <div class="section-title">3 Actions You Can Actually Take</div>
            <div class="tips-list">
                ${tips.map(t => `<div class="tip-item">✅ ${t}</div>`).join('')}
            </div>
        </div>

        <div class="results-actions">
            <button class="btn-restart" onclick="renderIntro()">↺ Start Over</button>
            <button class="btn-submit" id="submitBtn" onclick="submitToLMS('${profileType}')">
                Submit to Teacher &nbsp;&#10148;
            </button>
        </div>
    </div>`;
}

// ══════════════════════════════════════════════════════
// LMS SUBMISSION
// ══════════════════════════════════════════════════════
function submitToLMS(profileType) {
    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Submitting…';
    btn.disabled = true;

    const {total, cats, report} = calculateScore();
    const tonsCO2 = parseFloat((total / 2000).toFixed(1));
    const highestCategory = Object.entries(cats).reduce((a, b) => b[1] > a[1] ? b : a)[0];

    const payload = {
        action: 'SIM_COMPLETE',
        simData: {
            carbonTons: tonsCO2,
            highestCategory,
            categoryBreakdown: Object.fromEntries(
                Object.entries(cats).map(([k, v]) => [k, parseFloat((v / 2000).toFixed(2))])),
            profileUsed: profileType === 'user' ? 'Self' : profileType,
            detailedAnswers: report,
            rawAnswerIndices: answers
        }
    };
    window.parent.postMessage(payload, '*');

    setTimeout(() => {
        btn.textContent = 'Submitted! ✓';
        btn.classList.add('done');
    }, 700);
}

// Boot
renderIntro();
</script>
</body>
</html>
