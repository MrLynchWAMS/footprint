<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8th Grade Carbon Footprint Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4;
            color: #1f2937;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-card {
            transition: all 0.2s ease;
        }
        .option-card:hover {
            transform: translateY(-2px);
            border-color: #22c55e;
        }
        .option-card.selected {
            background-color: #dcfce7;
            border-color: #16a34a;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden min-h-[500px] flex flex-col relative">
        <!-- Header -->
        <div class="bg-green-600 text-white p-4 text-center relative z-10">
            <h1 class="text-2xl font-bold"><i class="fa-solid fa-earth-americas mr-2"></i> My Climate Impact</h1>
            <p class="text-green-100 text-sm mt-1">Student Carbon Footprint Calculator</p>
        </div>

        <!-- Progress Bar -->
        <div id="progress-container" class="w-full bg-gray-200 h-1.5 hidden">
            <div id="progress-bar" class="bg-green-500 h-1.5 transition-all duration-300 w-0"></div>
        </div>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="p-6 md:p-8 flex-grow flex flex-col justify-center">
            <!-- Content gets injected here via JS -->
        </div>

    </div>

    <script>
        // --- DATA & CONFIGURATION ---
        const BASELINE_CO2 = 4000; // Shared home infrastructure baseline

        const questions = [
            {
                id: 'q1',
                category: 'Food',
                title: "What does your diet mostly look like?",
                desc: "Producing food takes energy and water. Meat, especially beef, creates the most greenhouse gases.",
                options: [
                    { text: "I eat meat (beef, pork, chicken) almost every day.", icon: "fa-hamburger", value: 4000 },
                    { text: "I eat an average mix of meat and veggies.", icon: "fa-utensils", value: 2500 },
                    { text: "I am vegetarian (no meat, but eat dairy/eggs).", icon: "fa-cheese", value: 1500 },
                    { text: "I am vegan (mostly plant-based).", icon: "fa-leaf", value: 1000 }
                ]
            },
            {
                id: 'q2',
                category: 'Food',
                title: "How much food gets thrown away at your house or lunch?",
                desc: "Food waste sitting in landfills creates methane, a powerful greenhouse gas.",
                options: [
                    { text: "A lot. I rarely finish what's on my plate.", icon: "fa-trash-can", value: 1000 },
                    { text: "A little bit here and there.", icon: "fa-apple-whole", value: 500 },
                    { text: "Almost none. We eat leftovers or compost.", icon: "fa-recycle", value: 0 }
                ]
            },
            {
                id: 'q3',
                category: 'Transportation',
                title: "How do you usually get to school?",
                desc: "Cars burn fossil fuels. Sharing rides or using muscle power lowers emissions.",
                options: [
                    { text: "I am driven in a car, usually just me and my parent.", icon: "fa-car", value: 1500 },
                    { text: "I carpool with other students.", icon: "fa-users-viewfinder", value: 800 },
                    { text: "I take the school bus.", icon: "fa-bus", value: 400 },
                    { text: "I walk or ride my bike.", icon: "fa-person-biking", value: 0 }
                ]
            },
            {
                id: 'q4',
                category: 'Transportation',
                title: "On the weekends, how do you get around?",
                desc: "Think about sports, hanging out with friends, or running errands.",
                options: [
                    { text: "I am driven almost everywhere.", icon: "fa-car-side", value: 2000 },
                    { text: "A mix of being driven and walking/biking locally.", icon: "fa-shoe-prints", value: 1000 },
                    { text: "I mostly stay local, walk, or ride my bike.", icon: "fa-bicycle", value: 200 }
                ]
            },
            {
                id: 'q5',
                category: 'Energy',
                title: "How do you handle your electronics (phone, laptop, tablet)?",
                desc: "Even when devices are turned off, chargers left in the wall pull 'vampire power'.",
                options: [
                    { text: "I leave everything plugged in 24/7.", icon: "fa-plug", value: 800 },
                    { text: "I unplug devices when full, but leave chargers in the wall.", icon: "fa-battery-three-quarters", value: 400 },
                    { text: "I actively manage power, use power strips, and unplug chargers.", icon: "fa-bolt", value: 100 }
                ]
            },
            {
                id: 'q6',
                category: 'Energy',
                title: "When you leave your bedroom for the day, what do you do?",
                desc: "Heating, cooling, and lighting your home uses massive amounts of electricity.",
                options: [
                    { text: "I usually forget and leave lights/fans/TVs on.", icon: "fa-lightbulb", value: 1000 },
                    { text: "I turn off the lights, but leave fans or AC running.", icon: "fa-fan", value: 500 },
                    { text: "I turn off all lights, fans, and electronics.", icon: "fa-power-off", value: 100 }
                ]
            },
            {
                id: 'q7',
                category: 'Consumerism',
                title: "When you get new clothes, where do they come from?",
                desc: "'Fast fashion' requires massive amounts of water, shipping, and oil to produce.",
                options: [
                    { text: "Almost always brand new, trendy stuff from the mall/online.", icon: "fa-shirt", value: 2000 },
                    { text: "A mix of new stuff and some hand-me-downs/thrifted items.", icon: "fa-socks", value: 800 },
                    { text: "Mostly thrifted, vintage, or hand-me-downs.", icon: "fa-bag-shopping", value: 200 }
                ]
            },
            {
                id: 'q8',
                category: 'Consumerism',
                title: "What do you usually drink out of at lunch or sports practice?",
                desc: "Plastic is made from fossil fuels and takes hundreds of years to break down.",
                options: [
                    { text: "Single-use plastic water bottles, juice boxes, or Starbucks cups.", icon: "fa-bottle-water", value: 800 },
                    { text: "A mix of disposable stuff and reusables.", icon: "fa-glass-water", value: 400 },
                    { text: "Always a reusable water bottle (like a Stanley or Hydroflask).", icon: "fa-flask", value: 100 }
                ]
            }
        ];

        // Pre-made profiles
        const influencerAnswers = [0, 0, 0, 0, 0, 0, 0, 0]; // All highest options
        const ecoTeenAnswers = [3, 2, 3, 2, 2, 2, 2, 2]; // All lowest/most eco options

        // --- STATE ---
        let currentStep = -1; // -1 is intro screen
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentArea = document.getElementById('content-area');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        // --- CORE FUNCTIONS ---

        function renderIntro() {
            progressContainer.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="text-center fade-in">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600 text-4xl">
                        <i class="fa-solid fa-seedling"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold mb-4">Discover Your Impact</h2>
                    <p class="text-gray-600 mb-8 max-w-md mx-auto">
                        Climate change is a big global issue, but it starts with our daily habits. Let's find out how much your personal choices—from the food you eat to how you get to school—impact the planet.
                    </p>
                    
                    <button onclick="startQuiz()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all w-full md:w-auto mb-6">
                        Calculate My Footprint
                    </button>
                    
                    <div class="mt-4 border-t pt-6">
                        <p class="text-sm text-gray-500 mb-3 uppercase tracking-wider font-semibold">Or view a sample profile:</p>
                        <div class="flex flex-col gap-2 md:flex-row md:justify-center">
                            <button onclick="runSampleProfile('influencer')" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-4 rounded-lg transition-colors border border-gray-200">
                                <i class="fa-solid fa-mobile-screen mr-1"></i> The "Fast Fashion" Profile
                            </button>
                            <button onclick="runSampleProfile('eco')" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-4 rounded-lg transition-colors border border-gray-200">
                                <i class="fa-solid fa-bicycle mr-1"></i> The "Eco-Warrior" Profile
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            currentStep = 0;
            userAnswers = new Array(questions.length).fill(null);
            progressContainer.classList.remove('hidden');
            renderQuestion();
        }

        function runSampleProfile(type) {
            if(type === 'influencer') {
                userAnswers = [...influencerAnswers];
            } else {
                userAnswers = [...ecoTeenAnswers];
            }
            currentStep = questions.length;
            progressContainer.classList.add('hidden');
            renderResults(type);
        }

        function renderQuestion() {
            const q = questions[currentStep];
            const progress = ((currentStep) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            let optionsHtml = q.options.map((opt, index) => {
                const isSelected = userAnswers[currentStep] === index;
                return `
                    <button onclick="selectOption(${index})" class="option-card w-full text-left p-4 rounded-xl border-2 ${isSelected ? 'selected' : 'border-gray-200 bg-white hover:bg-gray-50'} mb-3 flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mr-4 flex-shrink-0 text-gray-600 ${isSelected ? 'bg-green-100 text-green-600' : ''}">
                            <i class="fa-solid ${opt.icon}"></i>
                        </div>
                        <span class="font-medium text-gray-800 ${isSelected ? 'text-green-800' : ''}">${opt.text}</span>
                    </button>
                `;
            }).join('');

            contentArea.innerHTML = `
                <div class="fade-in flex-grow flex flex-col">
                    <div class="mb-2 text-sm font-bold text-green-600 tracking-wider uppercase">${q.category} &bull; Question ${currentStep + 1} of ${questions.length}</div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">${q.title}</h2>
                    <p class="text-gray-500 mb-6 text-sm">${q.desc}</p>
                    
                    <div class="flex-grow">
                        ${optionsHtml}
                    </div>

                    <div class="flex justify-between mt-8 pt-4 border-t border-gray-100">
                        <button onclick="prevQuestion()" class="${currentStep === 0 ? 'invisible' : ''} text-gray-500 hover:text-gray-800 font-medium px-4 py-2 rounded-lg transition-colors">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Back
                        </button>
                        <button onclick="nextQuestion()" id="next-btn" class="${userAnswers[currentStep] !== null ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'} font-bold py-2 px-6 rounded-lg transition-colors" ${userAnswers[currentStep] === null ? 'disabled' : ''}>
                            ${currentStep === questions.length - 1 ? 'See Results' : 'Next'} <i class="fa-solid ${currentStep === questions.length - 1 ? 'fa-check' : 'fa-arrow-right'} ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            userAnswers[currentStep] = index;
            renderQuestion(); // Re-render to show selection and enable Next button
        }

        function prevQuestion() {
            if (currentStep > 0) {
                currentStep--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentStep] !== null) {
                if (currentStep < questions.length - 1) {
                    currentStep++;
                    renderQuestion();
                } else {
                    renderResults('user');
                }
            }
        }

        function calculateScore() {
            let totalScore = BASELINE_CO2;
            let categoryBreakdown = {
                'Food': 0,
                'Transportation': 0,
                'Energy': 0,
                'Consumerism': 0
            };

            for (let i = 0; i < questions.length; i++) {
                const answerIndex = userAnswers[i];
                const questionData = questions[i];
                const points = questionData.options[answerIndex].value;
                
                totalScore += points;
                categoryBreakdown[questionData.category] += points;
            }

            return { totalScore, categoryBreakdown };
        }

        function renderResults(profileType) {
            progressContainer.classList.add('hidden');
            const { totalScore, categoryBreakdown } = calculateScore();
            
            // Convert lbs to Tons
            const tonsCO2 = (totalScore / 2000).toFixed(1);
            
            // Find highest category
            let highestCategory = Object.keys(categoryBreakdown).reduce((a, b) => categoryBreakdown[a] > categoryBreakdown[b] ? a : b);

            // Context generation
            let message = "";
            let colorClass = "";
            let emoji = "";

            if (totalScore <= 8000) {
                message = "Incredible! Your footprint is significantly lower than the average US teen. You are making great, earth-conscious choices.";
                colorClass = "text-green-600";
                emoji = "🌱";
            } else if (totalScore <= 13000) {
                message = "You are right around the average for a US teenager! You do some things really well, but there is still room to improve your habits.";
                colorClass = "text-yellow-600";
                emoji = "🌎";
            } else {
                message = "Your footprint is higher than average. Your lifestyle relies heavily on fossil fuels. Small changes in your routine could make a massive difference.";
                colorClass = "text-red-500";
                emoji = "⚠️";
            }

            let profileBadge = "";
            if(profileType === 'influencer') {
                profileBadge = `<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded mb-4 inline-block"><i class="fa-solid fa-user-tag mr-1"></i> Sample Profile: The Influencer</span>`;
            } else if (profileType === 'eco') {
                profileBadge = `<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded mb-4 inline-block"><i class="fa-solid fa-leaf mr-1"></i> Sample Profile: The Eco-Warrior</span>`;
            }

            contentArea.innerHTML = `
                <div class="fade-in flex flex-col items-center text-center h-full justify-center">
                    ${profileBadge}
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Your Estimated Carbon Footprint</h2>
                    
                    <div class="my-6 relative">
                        <div class="w-48 h-48 rounded-full border-8 border-gray-100 flex items-center justify-center relative overflow-hidden">
                            <div class="text-center z-10">
                                <span class="text-5xl font-extrabold ${colorClass}">${tonsCO2}</span><br>
                                <span class="text-sm text-gray-500 font-bold uppercase tracking-wider">Tons / Year</span>
                            </div>
                        </div>
                    </div>

                    <p class="text-lg font-medium text-gray-800 max-w-md">${emoji} ${message}</p>
                    
                    <div class="bg-gray-50 rounded-xl p-4 mt-6 w-full max-w-sm border border-gray-100 text-left">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Analysis</h3>
                        <p class="text-sm text-gray-700">Your highest contributing category is: <strong class="text-green-700">${highestCategory}</strong>.</p>
                        <p class="text-xs text-gray-500 mt-1 italic">Use this info for your reflection assignment!</p>
                    </div>

                    <div class="mt-8 flex gap-4 w-full">
                        <button onclick="renderIntro()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg transition-colors">
                            <i class="fa-solid fa-rotate-left"></i> Retry
                        </button>
                        <button onclick="submitToLMS(${tonsCO2}, '${highestCategory}', '${profileType}')" id="submit-btn" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-blue-200 flex items-center justify-center">
                            <span>Submit to LMS</span> <i class="fa-solid fa-paper-plane ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function submitToLMS(score, topCategory, profileType) {
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = `<span>Submitting...</span> <i class="fa-solid fa-spinner fa-spin ml-2"></i>`;
            btn.classList.replace('bg-blue-600', 'bg-blue-400');
            btn.disabled = true;

            // Prepare data bundle
            const payload = {
                action: 'SIM_COMPLETE',
                simData: {
                    carbonTons: parseFloat(score),
                    highestCategory: topCategory,
                    profileUsed: profileType === 'user' ? 'Self' : profileType,
                    rawAnswers: userAnswers
                }
            };

            // Post message to parent LMS
            window.parent.postMessage(payload, '*');

            // Visual feedback for student
            setTimeout(() => {
                btn.innerHTML = `<span>Submitted Successfully!</span> <i class="fa-solid fa-check ml-2"></i>`;
                btn.classList.replace('bg-blue-400', 'bg-green-600');
            }, 800);
        }

        // Initialize
        renderIntro();

    </script>
</body>
</html>
