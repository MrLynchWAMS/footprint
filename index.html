<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8th Grade Carbon Footprint Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4;
            color: #1f2937;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-card {
            transition: all 0.2s ease;
        }
        .option-card:hover {
            transform: translateY(-2px);
            border-color: #22c55e;
        }
        .option-card.selected {
            background-color: #dcfce7;
            border-color: #16a34a;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.2);
        }
        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #16a34a;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #d1d5db;
            border-radius: 4px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #f3f4f6;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden min-h-[550px] flex flex-col relative">
        <!-- Header -->
        <div class="bg-green-600 text-white p-4 text-center relative z-10 shadow-md">
            <h1 class="text-2xl font-bold"><i class="fa-solid fa-earth-americas mr-2"></i> My Climate Impact</h1>
            <p class="text-green-100 text-sm mt-1">Student Carbon Footprint Calculator</p>
        </div>

        <!-- Progress Bar -->
        <div id="progress-container" class="w-full bg-gray-200 h-2 hidden">
            <div id="progress-bar" class="bg-green-400 h-2 transition-all duration-300 w-0"></div>
        </div>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="p-6 md:p-8 flex-grow flex flex-col justify-center overflow-y-auto">
            <!-- Content gets injected here via JS -->
        </div>
    </div>

    <script>
        // --- DATA & CONFIGURATION ---
        const BASELINE_CO2 = 6000; // Shared suburban home infrastructure baseline (lbs)

        const questions = [
            // FOOD
            {
                id: 'qMeatRed', category: 'Food', type: 'slider',
                title: "How many meals per week include RED MEAT (beef or lamb)?",
                desc: "Beef produces massive amounts of methane. Think about burgers, steaks, and tacos.",
                min: 0, max: 14, default: 4, unit: "meals / week", icon: "fa-hamburger",
                multiplier: 350 // lbs CO2 per year per weekly meal
            },
            {
                id: 'qMeatOther', category: 'Food', type: 'slider',
                title: "How many meals per week include POULTRY, PORK, or FISH?",
                desc: "Chicken and pork have a smaller footprint than beef, but still higher than plants.",
                min: 0, max: 21, default: 7, unit: "meals / week", icon: "fa-drumstick-bite",
                multiplier: 120 
            },
            {
                id: 'qTakeout', category: 'Food', type: 'slider',
                title: "How many times a week do you get takeout or food delivery (DoorDash)?",
                desc: "Delivery requires a car trip just for your food, plus loads of single-use containers.",
                min: 0, max: 10, default: 2, unit: "deliveries / week", icon: "fa-motorcycle",
                multiplier: 150 
            },
            {
                id: 'qFoodWaste', category: 'Food', type: 'options',
                title: "How much food gets thrown away at your house or lunch?",
                desc: "Food waste sitting in landfills creates methane, a powerful greenhouse gas.",
                options: [
                    { text: "Almost none. We eat leftovers or compost.", icon: "fa-recycle", value: 0 },
                    { text: "A little bit here and there.", icon: "fa-apple-whole", value: 400 },
                    { text: "A lot. I rarely finish what's on my plate.", icon: "fa-trash-can", value: 1000 }
                ]
            },
            // TRANSPORT
            {
                id: 'qCommuteMethod', category: 'Transportation', type: 'options',
                title: "How do you usually get to school?",
                desc: "Riding the bus or walking saves massive amounts of fuel compared to everyone driving separately.",
                options: [
                    { text: "Walk or pedal bike", icon: "fa-person-biking", value: 0 },
                    { text: "E-bike or Electric Scooter", icon: "fa-bolt", value: 100 },
                    { text: "Take the school bus", icon: "fa-bus", value: 300 },
                    { text: "Carpool with others", icon: "fa-users-viewfinder", value: 600 },
                    { text: "Driven in a car (just me and a parent)", icon: "fa-car", value: 1200 }
                ]
            },
            {
                id: 'qCommuteDist', category: 'Transportation', type: 'slider',
                title: "Roughly how many MILES is your commute to school?",
                desc: "If you walk, this is zero impact. E-bikes have a small impact. Cars add up quickly!",
                min: 1, max: 20, default: 5, unit: "miles (one way)", icon: "fa-route",
                multiplier: 80 
            },
            {
                id: 'qCarType', category: 'Transportation', type: 'options',
                title: "When you ride in a car, what type of vehicle is it usually?",
                desc: "Larger, heavier vehicles burn significantly more gas than smaller or electric cars.",
                options: [
                    { text: "Electric Vehicle (EV) or Plug-in Hybrid", icon: "fa-charging-station", value: -400 },
                    { text: "Standard Sedan or Small SUV", icon: "fa-car-side", value: 0 },
                    { text: "Large SUV (like a Tahoe), Minivan, or Pickup Truck", icon: "fa-truck", value: 600 }
                ]
            },
            {
                id: 'qWeekendCar', category: 'Transportation', type: 'slider',
                title: "On the weekend, how many HOURS do you spend riding in a car?",
                desc: "Think about driving to sports tournaments, the mall, running errands, or visiting family.",
                min: 0, max: 20, default: 4, unit: "hours / weekend", icon: "fa-car-side",
                multiplier: 200 
            },
            {
                id: 'qFlights', category: 'Transportation', type: 'slider',
                title: "How many round-trip FLIGHTS have you taken in the last year?",
                desc: "Airplanes burn massive amounts of fuel. Just one flight can double your entire yearly footprint.",
                min: 0, max: 10, default: 1, unit: "round-trip flights", icon: "fa-plane-departure",
                multiplier: 1500 
            },
            // HOUSING / ENERGY
            {
                id: 'qRoomSize', category: 'Housing & Energy', type: 'options',
                title: "How big is your bedroom?",
                desc: "Larger rooms take a lot more energy to heat in the winter and cool in the summer.",
                options: [
                    { text: "Small (about 10x10 ft - fits a twin bed and desk)", icon: "fa-bed", value: 200 },
                    { text: "Medium (about 12x12 ft - fits a queen bed and dressers)", icon: "fa-door-open", value: 500 },
                    { text: "Large (bigger than 15x15 ft - size of a master suite or 2-car garage)", icon: "fa-house", value: 1000 }
                ]
            },
            {
                id: 'qRoomShare', category: 'Housing & Energy', type: 'options',
                title: "Do you share your bedroom with a sibling?",
                desc: "Sharing a room cuts your heating, cooling, and lighting footprint in half!",
                options: [
                    { text: "Yes, I share my room.", icon: "fa-user-group", value: -400 }, 
                    { text: "No, I have my own room.", icon: "fa-user", value: 0 }
                ]
            },
            {
                id: 'qTemp', category: 'Housing & Energy', type: 'options',
                title: "How do you handle the temperature in your bedroom?",
                desc: "Heating and cooling are usually the biggest energy drains in a house.",
                options: [
                    { text: "Eco: I use blankets/sweaters if cold, and fans if hot.", icon: "fa-leaf", value: -200 },
                    { text: "Normal: I just let the house thermostat do its thing.", icon: "fa-thermometer-half", value: 0 },
                    { text: "Wasteful: I use a space heater, or leave windows open while the AC/heat is on.", icon: "fa-temperature-arrow-up", value: 500 }
                ]
            },
            {
                id: 'qScreens', category: 'Housing & Energy', type: 'slider',
                title: "How many HOURS a day do you spend using large screens/electronics?",
                desc: "Include TVs, gaming consoles, and desktop computers (these use way more power than phones).",
                min: 0, max: 12, default: 4, unit: "hours / day", icon: "fa-gamepad",
                multiplier: 150
            },
            {
                id: 'qStreaming', category: 'Housing & Energy', type: 'slider',
                title: "How many HOURS a day do you stream video (TikTok, YouTube, Netflix)?",
                desc: "Data centers that stream video require massive amounts of electricity to run and stay cool.",
                min: 0, max: 12, default: 3, unit: "hours / day", icon: "fa-wifi",
                multiplier: 40
            },
            {
                id: 'qAI', category: 'Housing & Energy', type: 'slider',
                title: "How many AI prompts (ChatGPT, Snapchat MyAI, etc.) do you use in a week?",
                desc: "Generating an AI response uses up to 10 times the electricity and water of a standard Google search.",
                min: 0, max: 100, default: 10, unit: "prompts / week", icon: "fa-robot",
                multiplier: 4
            },
            {
                id: 'qCharging', category: 'Housing & Energy', type: 'options',
                title: "How do you handle charging your devices?",
                desc: "Even when devices are 100% charged, plugged-in chargers pull 'vampire power'.",
                options: [
                    { text: "I actively unplug chargers when not using them.", icon: "fa-bolt", value: 0 },
                    { text: "I unplug my phone, but leave the cord in the wall.", icon: "fa-battery-three-quarters", value: 300 },
                    { text: "I leave my stuff plugged in 24/7.", icon: "fa-plug", value: 600 }
                ]
            },
            // CONSUMERISM
            {
                id: 'qClothes', category: 'Consumerism', type: 'slider',
                title: "How many NEW items of clothing do you get per month?",
                desc: "'Fast fashion' requires massive amounts of water, shipping, and oil to produce.",
                min: 0, max: 15, default: 3, unit: "items / month", icon: "fa-shirt",
                multiplier: 180
            },
            {
                id: 'qBeauty', category: 'Consumerism', type: 'slider',
                title: "How many new skincare, makeup, or hair products do you buy a month?",
                desc: "The beauty industry relies heavily on single-use plastics, complex chemical processing, and global shipping.",
                min: 0, max: 15, default: 2, unit: "products / month", icon: "fa-pump-soap",
                multiplier: 50
            },
            {
                id: 'qPackages', category: 'Consumerism', type: 'slider',
                title: "How many online packages (Amazon, TikTok Shop, etc.) arrive just for you in a month?",
                desc: "Think about the cardboard, plastic wrap, and the delivery truck driving to your house.",
                min: 0, max: 20, default: 3, unit: "packages / month", icon: "fa-box-open",
                multiplier: 60
            },
            {
                id: 'qCups', category: 'Consumerism', type: 'slider',
                title: "How many heavy reusable cups (Stanley, Yeti, Hydroflask) do you own?",
                desc: "Producing a steel cup takes 100x more energy than plastic. Owning one is eco-friendly. Owning a collection is a trend.",
                min: 1, max: 20, default: 2, unit: "reusable cups", icon: "fa-mug-hot",
                multiplier: 100 // Punishes having a massive collection
            },
            {
                id: 'qPlastics', category: 'Consumerism', type: 'slider',
                title: "How many single-use plastic bottles/cups do you use per week?",
                desc: "Includes water bottles, Starbucks plastic cups, Gatorade bottles. Plastic is made from oil.",
                min: 0, max: 30, default: 5, unit: "bottles / week", icon: "fa-bottle-water",
                multiplier: 40
            },
            {
                id: 'qShoes', category: 'Consumerism', type: 'slider',
                title: "How many NEW pairs of shoes/sneakers do you get in a year?",
                desc: "Manufacturing rubber, foam, and leather for shoes is a highly carbon-intensive process.",
                min: 0, max: 15, default: 3, unit: "pairs / year", icon: "fa-shoe-prints",
                multiplier: 70
            },
            {
                id: 'qPhone', category: 'Consumerism', type: 'options',
                title: "How often do you get a new cell phone?",
                desc: "Manufacturing the battery and mining the metals for a smartphone creates a huge carbon spike.",
                options: [
                    { text: "Every year (I always want the newest model)", icon: "fa-mobile-screen-button", value: 800 },
                    { text: "Every 2-3 years", icon: "fa-mobile-screen", value: 300 },
                    { text: "I keep it until it breaks, or I buy refurbished", icon: "fa-recycle", value: 50 },
                    { text: "I don't have my own cell phone", icon: "fa-ban", value: 0 }
                ]
            }
        ];

        // Pre-made profiles updated for 23 questions
        const influencerAnswers = [8, 10, 5, 2, 4, 10, 2, 12, 4, 2, 1, 2, 8, 8, 50, 2, 12, 10, 15, 12, 20, 10, 0]; 
        const ecoTeenAnswers =    [0, 2,  0, 0, 0, 2,  0, 2,  0, 0, 0, 0, 2, 1, 0,  0, 1,  0,  1,  1,  1,  1,  2];

        // --- STATE ---
        let currentStep = -1; 
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentArea = document.getElementById('content-area');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        // --- CORE FUNCTIONS ---

        function renderIntro() {
            progressContainer.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="text-center fade-in py-4">
                    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600 text-5xl shadow-inner">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold mb-4 text-gray-800">Discover Your Impact</h2>
                    <p class="text-gray-600 mb-8 max-w-lg mx-auto leading-relaxed">
                        Climate change is a global issue, but it starts with our daily habits. Let's find out how much your personal choices—from the food you eat to your screen time—impact the planet.
                    </p>
                    
                    <button onclick="startQuiz()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:shadow-xl transition-all w-full md:w-auto text-lg mb-8">
                        Start My Audit <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                    
                    <div class="mt-4 border-t border-gray-200 pt-6">
                        <p class="text-sm text-gray-500 mb-4 uppercase tracking-wider font-bold">Or analyze a sample profile:</p>
                        <div class="flex flex-col gap-3 md:flex-row md:justify-center">
                            <button onclick="runSampleProfile('influencer')" class="text-sm bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold py-2 px-5 rounded-xl transition-colors border border-purple-200 shadow-sm flex items-center justify-center">
                                <i class="fa-solid fa-mobile-screen mr-2"></i> The "Influencer"
                            </button>
                            <button onclick="runSampleProfile('eco')" class="text-sm bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-2 px-5 rounded-xl transition-colors border border-emerald-200 shadow-sm flex items-center justify-center">
                                <i class="fa-solid fa-bicycle mr-2"></i> The "Eco-Teen"
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            currentStep = 0;
            userAnswers = new Array(questions.length).fill(null);
            progressContainer.classList.remove('hidden');
            renderQuestion();
        }

        function runSampleProfile(type) {
            userAnswers = type === 'influencer' ? [...influencerAnswers] : [...ecoTeenAnswers];
            currentStep = questions.length;
            progressContainer.classList.add('hidden');
            renderResults(type);
        }

        function updateSliderValue(val, unit) {
            document.getElementById('slider-value-display').innerText = `${val} ${unit}`;
            userAnswers[currentStep] = parseInt(val);
            // Ensure next button is enabled
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.replace('bg-gray-200', 'bg-green-600');
            nextBtn.classList.replace('text-gray-400', 'text-white');
            nextBtn.classList.remove('cursor-not-allowed');
            nextBtn.disabled = false;
        }

        function renderQuestion() {
            const q = questions[currentStep];
            const progress = ((currentStep) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            let inputHtml = "";

            if (q.type === 'options') {
                inputHtml = q.options.map((opt, index) => {
                    const isSelected = userAnswers[currentStep] === index;
                    return `
                        <button onclick="selectOption(${index})" class="option-card w-full text-left p-4 rounded-xl border-2 ${isSelected ? 'selected' : 'border-gray-200 bg-white hover:bg-gray-50'} mb-3 flex items-center">
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mr-4 flex-shrink-0 text-gray-600 text-lg ${isSelected ? 'bg-green-100 text-green-600' : ''}">
                                <i class="fa-solid ${opt.icon}"></i>
                            </div>
                            <span class="font-medium text-gray-800 text-lg ${isSelected ? 'text-green-800 font-bold' : ''}">${opt.text}</span>
                        </button>
                    `;
                }).join('');
            } else if (q.type === 'slider') {
                // Initialize default if null
                if (userAnswers[currentStep] === null) {
                    userAnswers[currentStep] = q.default;
                }
                const currentVal = userAnswers[currentStep];
                
                inputHtml = `
                    <div class="bg-white p-8 rounded-xl border-2 border-green-100 shadow-sm mt-4">
                        <div class="text-center mb-8">
                            <div class="text-5xl font-extrabold text-green-600 mb-2" id="slider-value-display">${currentVal} ${q.unit}</div>
                        </div>
                        <input type="range" min="${q.min}" max="${q.max}" step="1" value="${currentVal}" 
                               oninput="updateSliderValue(this.value, '${q.unit}')" 
                               class="w-full">
                        <div class="flex justify-between text-gray-400 text-sm mt-2 font-medium">
                            <span>${q.min}</span>
                            <span>${q.max}</span>
                        </div>
                    </div>
                `;
            }

            const canProceed = userAnswers[currentStep] !== null;

            contentArea.innerHTML = `
                <div class="fade-in flex-grow flex flex-col h-full">
                    <div class="mb-3 flex items-center justify-between">
                        <span class="text-sm font-bold text-green-600 tracking-wider uppercase bg-green-50 px-3 py-1 rounded-full"><i class="fa-solid ${q.icon} mr-2"></i> ${q.category}</span>
                        <span class="text-sm font-bold text-gray-400">${currentStep + 1} / ${questions.length}</span>
                    </div>
                    
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-3 leading-tight">${q.title}</h2>
                    <p class="text-gray-500 mb-6 text-base">${q.desc}</p>
                    
                    <div class="flex-grow">
                        ${inputHtml}
                    </div>

                    <div class="flex justify-between mt-8 pt-6 border-t border-gray-100">
                        <button onclick="prevQuestion()" class="${currentStep === 0 ? 'invisible' : ''} text-gray-500 hover:text-gray-800 font-bold px-4 py-2 rounded-lg transition-colors flex items-center">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Back
                        </button>
                        <button onclick="nextQuestion()" id="next-btn" class="${canProceed ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'} font-bold py-3 px-8 rounded-xl transition-all shadow-md flex items-center text-lg" ${!canProceed ? 'disabled' : ''}>
                            ${currentStep === questions.length - 1 ? 'See Results' : 'Next'} <i class="fa-solid ${currentStep === questions.length - 1 ? 'fa-chart-pie' : 'fa-arrow-right'} ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            userAnswers[currentStep] = index;
            renderQuestion(); // Re-render to show selection and enable Next button
        }

        function prevQuestion() {
            if (currentStep > 0) {
                currentStep--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentStep] !== null) {
                if (currentStep < questions.length - 1) {
                    currentStep++;
                    renderQuestion();
                } else {
                    renderResults('user');
                }
            }
        }

        function calculateScore() {
            let totalScore = BASELINE_CO2;
            let categoryBreakdown = {
                'Food': 0,
                'Transportation': 0,
                'Housing & Energy': 0,
                'Consumerism': 0
            };
            
            let detailedReport = [];

            for (let i = 0; i < questions.length; i++) {
                const answer = userAnswers[i];
                const q = questions[i];
                let points = 0;
                let answerText = "";

                if (q.type === 'options') {
                    points = q.options[answer].value;
                    answerText = q.options[answer].text;
                } else if (q.type === 'slider') {
                    points = answer * q.multiplier;
                    answerText = `${answer} ${q.unit}`;
                }

                // Special edge case: If they walk/bike or e-bike to school, adjust commute distance impact
                if (q.id === 'qCommuteDist') { 
                    const methodIndex = questions.findIndex(quest => quest.id === 'qCommuteMethod');
                    const methodAnswer = userAnswers[methodIndex]; 
                    if (methodAnswer === 0) { // Walk/Pedal Bike
                        points = 0; 
                    } else if (methodAnswer === 1) { // E-bike
                        points = answer * 10; // Much lower impact per mile than a car
                    }
                }

                totalScore += points;
                categoryBreakdown[q.category] += points;
                
                // Save readable data for the teacher's LMS
                detailedReport.push({
                    questionId: q.id,
                    questionTitle: q.title,
                    category: q.category,
                    answerGiven: answerText,
                    carbonPointsAdded: points
                });
            }

            return { totalScore, categoryBreakdown, detailedReport };
        }

        function renderResults(profileType) {
            progressContainer.classList.add('hidden');
            contentArea.scrollTo(0,0);
            
            const { totalScore, categoryBreakdown } = calculateScore();
            
            // Convert lbs to Tons
            const tonsCO2 = (totalScore / 2000).toFixed(1);
            
            // Find highest category
            let highestCategory = Object.keys(categoryBreakdown).reduce((a, b) => categoryBreakdown[a] > categoryBreakdown[b] ? a : b);

            // Calculate striking facts
            const sharks = Math.max(1, Math.round(tonsCO2)); // 1 ton = roughly 1 great white shark
            const houses = Math.max(1, Math.round(tonsCO2)); // 1 ton of CO2 gas fills ~1 two-story house
            const earths = Math.max(0.5, (tonsCO2 / 4.5)).toFixed(1); // Global sustainability target is ~4.5 tons
            const trees = Math.round(tonsCO2 * 41).toLocaleString(); // 1 ton = ~41 mature trees to absorb in a year
            const carMiles = Math.round(tonsCO2 * 2500).toLocaleString(); // 1 ton = ~2,500 miles driven

            let profileBadge = "";
            if(profileType === 'influencer') {
                profileBadge = `<div class="bg-purple-100 text-purple-800 text-sm font-bold px-4 py-2 rounded-full mb-6 inline-block mx-auto"><i class="fa-solid fa-user-tag mr-2"></i> Viewing Profile: The Influencer</div>`;
            } else if (profileType === 'eco') {
                profileBadge = `<div class="bg-emerald-100 text-emerald-800 text-sm font-bold px-4 py-2 rounded-full mb-6 inline-block mx-auto"><i class="fa-solid fa-leaf mr-2"></i> Viewing Profile: The Eco-Teen</div>`;
            }

            // Generate comparison bars width
            const maxComparison = Math.max(20, tonsCO2); // Scale max to 20 or user's score
            const usAvgWidth = (15 / maxComparison) * 100;
            const globalAvgWidth = (4.5 / maxComparison) * 100;
            const userWidth = (tonsCO2 / maxComparison) * 100;

            let colorClass = tonsCO2 < 10 ? "text-green-600" : (tonsCO2 < 16 ? "text-yellow-500" : "text-red-500");

            contentArea.innerHTML = `
                <div class="fade-in pb-4">
                    <div class="text-center">
                        ${profileBadge}
                        <h2 class="text-2xl font-bold text-gray-800 mb-1">Your Carbon Footprint</h2>
                        <p class="text-gray-500 text-sm mb-6">Estimated Greenhouse Gas Emissions per Year</p>
                        
                        <div class="inline-block relative mb-8">
                            <div class="text-7xl font-black ${colorClass} tracking-tighter">${tonsCO2}</div>
                            <div class="text-xl font-bold text-gray-400 uppercase tracking-widest mt-1">Tons of CO₂</div>
                        </div>
                    </div>

                    <!-- Striking Facts Grid -->
                    <div class="mb-8">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3 text-center">What does ${tonsCO2} tons look like?</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="stat-card flex items-center text-left">
                                <div class="text-4xl text-blue-400 w-16 text-center"><i class="fa-solid fa-water"></i></div>
                                <div>
                                    <div class="font-bold text-gray-800 text-lg">Weight Equivalent</div>
                                    <div class="text-sm text-gray-600">Your carbon weighs as much as <strong>${sharks} Great White Sharks</strong>.</div>
                                </div>
                            </div>
                            <div class="stat-card flex items-center text-left">
                                <div class="text-4xl text-yellow-500 w-16 text-center"><i class="fa-solid fa-house-chimney-window"></i></div>
                                <div>
                                    <div class="font-bold text-gray-800 text-lg">Volume Equivalent</div>
                                    <div class="text-sm text-gray-600">As a gas, it would completely fill <strong>${houses} two-story houses</strong>.</div>
                                </div>
                            </div>
                            <div class="stat-card flex items-center text-left">
                                <div class="text-4xl text-green-500 w-16 text-center"><i class="fa-solid fa-tree"></i></div>
                                <div>
                                    <div class="font-bold text-gray-800 text-lg">Tree Offset</div>
                                    <div class="text-sm text-gray-600">It would take <strong>${trees} mature trees</strong> a full year to absorb this.</div>
                                </div>
                            </div>
                            <div class="stat-card flex items-center text-left">
                                <div class="text-4xl text-gray-500 w-16 text-center"><i class="fa-solid fa-car-rear"></i></div>
                                <div>
                                    <div class="font-bold text-gray-800 text-lg">Car Equivalent</div>
                                    <div class="text-sm text-gray-600">This equals driving a gas car for <strong>${carMiles} miles</strong>.</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Comparison Chart -->
                    <div class="bg-gray-50 rounded-2xl p-5 border border-gray-100 mb-8">
                        <h3 class="font-bold text-gray-800 mb-4 flex items-center"><i class="fa-solid fa-chart-bar mr-2 text-gray-400"></i> Global Comparison</h3>
                        
                        <div class="mb-3">
                            <div class="flex justify-between text-xs font-bold mb-1 text-gray-600">
                                <span>Global Average</span> <span>4.5 Tons</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="bg-green-400 h-3 rounded-full" style="width: ${globalAvgWidth}%"></div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="flex justify-between text-xs font-bold mb-1 text-gray-600">
                                <span>Average US Teen</span> <span>~15.0 Tons</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="bg-yellow-400 h-3 rounded-full" style="width: ${usAvgWidth}%"></div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <div class="flex justify-between text-xs font-bold mb-1 ${colorClass}">
                                <span>You (This Profile)</span> <span>${tonsCO2} Tons</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="${tonsCO2 < 10 ? 'bg-green-600' : (tonsCO2 < 16 ? 'bg-yellow-500' : 'bg-red-500')} h-3 rounded-full" style="width: ${userWidth}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Earth Overshoot -->
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-5 rounded-r-xl mb-8">
                        <h3 class="font-bold text-blue-900 mb-1 flex items-center"><i class="fa-solid fa-globe mr-2"></i> The "Earth" Metric</h3>
                        <p class="text-blue-800 text-sm">
                            If everyone on the planet lived exactly like this profile, we would need <strong>${earths} Earths</strong> to absorb the carbon pollution safely.
                        </p>
                    </div>

                    <!-- Highest Category for Reflection -->
                    <div class="text-center mb-8 border-t border-b border-gray-100 py-6">
                        <p class="text-gray-500 text-sm font-bold uppercase tracking-wider mb-2">Highest Emitting Category:</p>
                        <p class="text-2xl font-black text-gray-800">${highestCategory}</p>
                        <p class="text-xs text-gray-400 mt-2 italic">Make sure to note this down for your written reflection!</p>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-col md:flex-row gap-4 w-full">
                        <button onclick="renderIntro()" class="md:w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-4 px-4 rounded-xl transition-colors border border-gray-200">
                            <i class="fa-solid fa-rotate-left mr-2"></i> Start Over
                        </button>
                        <button onclick="submitToLMS('${profileType}')" id="submit-btn" class="md:w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-lg shadow-blue-200/50 flex items-center justify-center text-lg hover:-translate-y-1">
                            <span>Submit Data to Teacher</span> <i class="fa-solid fa-paper-plane ml-3"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function submitToLMS(profileType) {
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = `<span>Submitting...</span> <i class="fa-solid fa-spinner fa-spin ml-3"></i>`;
            btn.classList.replace('bg-blue-600', 'bg-blue-400');
            btn.disabled = true;

            // Recalculate to get the detailed reporting data
            const { totalScore, categoryBreakdown, detailedReport } = calculateScore();
            const tonsCO2 = parseFloat((totalScore / 2000).toFixed(1));
            const highestCategory = Object.keys(categoryBreakdown).reduce((a, b) => categoryBreakdown[a] > categoryBreakdown[b] ? a : b);

            // Prepare data bundle exactly as requested, now with highly readable answers
            const payload = {
                action: 'SIM_COMPLETE',
                simData: {
                    carbonTons: tonsCO2,
                    highestCategory: highestCategory,
                    profileUsed: profileType === 'user' ? 'Self' : profileType,
                    detailedAnswers: detailedReport, // Array of { question, answerGiven, pointsAdded }
                    rawAnswerIndices: userAnswers
                }
            };

            // Post message to parent LMS
            window.parent.postMessage(payload, '*');

            // Visual feedback for student
            setTimeout(() => {
                btn.innerHTML = `<span>Submitted Successfully!</span> <i class="fa-solid fa-check ml-3"></i>`;
                btn.classList.replace('bg-blue-400', 'bg-green-600');
                btn.classList.replace('hover:-translate-y-1', 'cursor-default');
            }, 800);
        }

        // Initialize App
        renderIntro();

    </script>
</body>
