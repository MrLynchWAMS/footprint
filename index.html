<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Climate Impact — Carbon Footprint Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],serif:['DM Serif Display','serif']},colors:{brand:{50:'#f0fdf4',100:'#dcfce7',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'}}}}}</script>
<style>
body{background:#f0fdf4;background-image:radial-gradient(circle at top right,#dcfce7 0%,transparent 40%),radial-gradient(circle at bottom left,#dcfce7 0%,transparent 40%);background-attachment:fixed}
.fade-in{animation:fi .4s ease-out forwards}@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
input[type=range]{-webkit-appearance:none;width:100%;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:32px;width:32px;border-radius:50%;background:#16a34a;cursor:pointer;margin-top:-12px;border:3px solid #fff;box-shadow:0 4px 10px rgba(22,163,74,.3)}
input[type=range]::-moz-range-thumb{height:28px;width:28px;border-radius:50%;background:#16a34a;border:3px solid #fff}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#e5e7eb;border-radius:999px}
.opt{transition:all .2s}.opt:hover{transform:translateY(-2px)}.opt.sel{background:#f0fdf4;border-color:#16a34a;box-shadow:0 0 0 2px rgba(22,163,74,.2)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6 text-gray-800">
<div class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl overflow-hidden min-h-[600px] flex flex-col border border-gray-100">
  <div class="bg-brand-900 text-white p-6 shrink-0">
    <h1 class="font-serif text-3xl md:text-4xl">🌿 My <span class="text-brand-500 italic">Climate</span> Impact</h1>
    <p class="text-brand-100 text-sm font-semibold tracking-wider uppercase mt-2 opacity-80">8th Grade Carbon Footprint Audit</p>
  </div>
  <div id="pc" class="w-full bg-gray-100 h-2 hidden shrink-0"><div id="bar" class="bg-brand-500 h-2 transition-all duration-500 w-0"></div></div>
  <div id="ca" class="p-6 md:p-8 flex-grow flex flex-col overflow-y-auto"></div>
</div>

<script>
// ═══ CONFIG ═══════════════════════════════════════════════════════════
const SIM_VERSION = '2.1';
const FAST_ANSWER_SECONDS = 2;  // answers faster than this count as "fast" (possible rushing)
const PARENT_ORIGIN = 'https://custom.scienceclass.rocks'; // IteratED wrapper origin
// Calibration (metric tons CO2e per person per year). Set and cite your sources here.
// BASELINE is derived below so that the "average" sample profile scores exactly TARGET_AVG_TONS.
const TARGET_AVG_TONS = 15;     // typical American, all sources
const GLOBAL_AVG_TONS = 4.7;    // world per-person average
const SUSTAINABLE_TONS = 2.3;   // commonly cited climate-aligned per-person share
const CATS = ['Food','Transportation','Housing & Energy','Digital Life','Consumerism'];
const CARS=[.3,.5,.65,1,1.7], MODE=[0,.05,.2,.33,.5,1], SECOND=[.3,.7,1,1.15], KG_PER_MILE=145;

// ═══ QUESTIONS ════════════════════════════════════════════════════════
// grp: 'you' = your own choices, 'home' = your household's choices. f(answer, ctx) returns kg CO2e/yr.
const S=(id,cat,grp,icon,title,desc,min,max,def,unit,f)=>({id,cat,grp,icon,title,desc,type:'slider',min,max,def,unit,f});
const O=(id,cat,grp,icon,title,desc,texts,f)=>({id,cat,grp,icon,title,desc,type:'options',texts,f:Array.isArray(f)?(i=>f[i]):f});
const Q=[
S('meatRed','Food','you','🍔','How many meals a week include red meat?','Beef and lamb are carbon-heavy: cattle produce methane and need huge amounts of land.',0,14,4,'meals / week',v=>v*150),
S('meatOther','Food','you','🍗','How many meals a week include chicken, pork, or fish?','Lower than beef, but still higher than plant-based meals.',0,21,7,'meals / week',v=>v*35),
O('dairy','Food','you','🥛','How much dairy do you consume?','Milk, cheese, yogurt, and ice cream come from cows, a major hidden carbon source.',['None — plant-based alternatives','A little — occasional cheese or yogurt','Moderate — daily milk and regular cheese','A lot — ice cream, milkshakes, cheese on everything'],[0,135,340,635]),
O('caffeine','Food','you','☕','What is your coffee, energy drink, or boba habit?','Cups, dairy, a car trip, and global shipping all add up.',["I don't drink coffee, boba, or specialty drinks",'Home-brewed with a reusable mug','Occasional coffee shop or drive-through','Daily Starbucks, Dutch Bros, boba, or similar'],[0,25,90,295]),
S('takeout','Food','you','🛵','How many times a week do you get takeout or delivery?','Delivery means a car trip plus single-use containers.',0,10,2,'deliveries / week',v=>v*105),
O('foodWaste','Food','home','🗑️','How much food gets wasted at your house?','Food rotting in landfills makes methane. The US wastes 30–40% of its food.',['Almost none — we eat leftovers or compost','A little — some food occasionally goes bad','A fair amount — leftovers often get tossed','A lot — food gets thrown out nearly every day'],(i,c)=>[0,115,270,500][i]*c.hh),
O('pets','Food','home','🐾','Does your household have any pets?','Meat-based pet food has a real footprint. A large dog eats a lot.',['No pets','Cat or small dog (or fish, bird, hamster)','Medium-sized dog','Large dog (Lab, Golden Retriever, Husky)','Multiple large dogs or multiple pets'],(i,c)=>[0,90,225,410,725][i]*c.hh),

O('carType','Transportation','home','🚗','When you ride in a car, what type is it usually?','A large SUV burns 2–3× the fuel of a small sedan. This changes your driving totals below.',['Full Electric Vehicle (EV)','Plug-in Hybrid (PHEV)','Regular Hybrid (like a Prius)','Small or midsize sedan or SUV','Large SUV, Minivan, or Pickup Truck'],[0,0,0,0,0]),
O('commute','Transportation','you','🏫','How do you usually get to school?','Your commute happens about 180 days a year.',['Walk or pedal bike','E-bike or electric scooter','School bus','Carpool (3 or more people in the car)','Carpool (just you and one other person)','Private drop-off (you and a parent/guardian)'],[0,0,0,0,0,0]),
{...S('commuteDist','Transportation','you','📍','How many miles is your school commute one-way?','Distance multiplies the impact of your commute method.',0,10,2,'miles (one way)',(v,c)=>v*KG_PER_MILE*c.mode*(c.carMode?c.car:1)),skip:()=>ans.commute===0},
S('weekendCar','Transportation','home','🗺️','On a typical weekend, how many hours do you ride in a car?','Count errands, mall trips, and restaurants. Sports travel is the next-but-one question.',0,20,4,'hours / weekend',(v,c)=>v*159*c.car),
O('sports','Transportation','you','🏆','How far do you travel for sports or activities?','Club sports and tournaments can mean hours of driving per weekend.',["I don't do organized sports or travel activities",'Local only — under 15 minutes away','Regional — occasional 30–60 minute drives','Travel team — frequent multi-hour drives or overnights'],[0,135,360,900]),
O('flights','Transportation','home','✈️','How many round-trip flights did you take in the last year?','Flying is one of the most carbon-intensive activities per hour.',['None','1 short flight (under 2 hrs)','2–3 short flights','1 long flight (cross-country or international)','2+ long flights'],[0,500,1270,1590,3400]),

S('hhSize','Housing & Energy','home','👥','Including you, how many people live in your home?','Heating, cooling, and lighting a home are shared by everyone in it.',1,8,4,'people',()=>0),
O('house','Housing & Energy','home','🏠','What type of home do you live in?','Larger homes need much more energy to heat and cool.',['Apartment or condo','Townhouse or rowhouse','Small detached house','Large detached house'],(i,c)=>[0,180,410,815][i]*c.hh*c.green),
O('heating','Housing & Energy','home','🔥','How is your home mostly heated?','Gas and oil burn fuel on site; electricity depends on how it is generated.',['Natural gas','Heating oil','Electric (heat pump or baseboard)','Not sure'],(i,c)=>[320,450,100,320][i]*c.hh*c.green),
O('green','Housing & Energy','home','☀️','Does your home use solar or 100% green electricity?','Solar or a green energy plan cuts your home energy footprint.',['Yes','Not sure','No'],[0,0,0]),
O('temp','Housing & Energy','you','🌡️','How do you manage the temperature in your room?','Heating and cooling are nearly half of home energy use.',['Eco: blankets when cold, fans instead of AC','Normal: I let the house thermostat handle it','A little wasteful: space heater or window AC','Very wasteful: windows open while AC runs'],[0,70,250,480]),

S('screens','Digital Life','you','🎮','How many hours a day do you game or use large screens?','TVs and consoles use 10–50× more electricity than a phone.',0,12,3,'hours / day',v=>v*20),
S('streaming','Digital Life','you','📱','How many hours a day do you stream video?','Data centers need electricity and cooling to serve every video.',0,12,3,'hours / day',v=>v*18),
S('ai','Digital Life','you','🤖','How many AI prompts do you use per week?','One prompt uses more electricity than one web search, but a single prompt is small. It adds up across millions of users.',0,200,10,'prompts / week',v=>v*0.1),

O('secondhand','Consumerism','you','♻️','Do you shop secondhand?','A secondhand garment has a far lower footprint than a new one. This changes your clothing and shoe totals.',['Yes — most of my clothes come secondhand','Sometimes — I mix new and used','Rarely — I mostly buy new','Never — I only buy new'],[0,0,0,0]),
S('clothes','Consumerism','you','👕','How many new clothing items do you get per month?','Making, dyeing, and shipping clothes takes a lot of energy.',0,20,3,'items / month',(v,c)=>v*76*c.sh),
S('shoes','Consumerism','you','👟','How many new pairs of shoes do you get per year?','Rubber and foam manufacturing is carbon-heavy.',0,15,3,'pairs / year',(v,c)=>v*14*c.sh),
S('packages','Consumerism','you','📦','How many online packages arrive just for you per month?','Each one means packaging and a delivery truck.',0,20,3,'packages / month',v=>v*11),
S('drinks','Consumerism','you','🥫','How many single-use drinks do you have per week?','Energy drink cans, plastic water bottles, and disposable cups. Aluminum and plastic take lots of energy to make.',0,30,5,'drinks / week',v=>v*4.5),
S('cups','Consumerism','you','🥤','How many heavy reusable cups do you own? (Stanley, Yeti)','A steel tumbler takes far more energy to make than a plastic bottle. The first 2 are treated as useful; extras count.',0,20,2,'cups owned',v=>Math.max(0,v-2)*9),
O('phone','Consumerism','you','📲','How often do you get a new cell phone?','Making a phone (mining, chips, assembly) is most of its lifetime footprint.',['Every year — I want the newest model','Every 2 years','Every 3–4 years','Until it breaks, or I buy refurbished',"I don't have my own phone"],[70,35,20,12,0]),
S('beauty','Consumerism','you','🧴','How many new beauty or skincare products do you buy a month?','Mostly single-use plastic and chemical manufacturing.',0,15,2,'products / month',v=>v*6)
];

// ═══ SCORING ══════════════════════════════════════════════════════════
function ctx(m){const s=m.hhSize??4;return{car:CARS[m.carType]??1,hh:Math.min(1.5,Math.max(.4,3/s)),green:m.green===0?.6:1,sh:SECOND[m.secondhand]??1,mode:MODE[m.commute]??1,carMode:m.commute>=3}}
const pts=(q,m)=>m[q.id]==null?0:Math.round(q.f(m[q.id],ctx(m)));
const modeled=m=>Q.reduce((t,q)=>t+pts(q,m),0);
const ansText=(q,a)=>q.texts?q.texts[a]:`${a} ${q.unit}`;
const skipped=i=>Q[i].skip&&Q[i].skip();

// Sample profiles: answers keyed by question id (options = option index, sliders = value). Unlisted ids use AVG.
const AVG={meatRed:4,meatOther:7,dairy:2,caffeine:1,takeout:2,foodWaste:2,pets:1,carType:3,commute:3,commuteDist:2,weekendCar:4,sports:1,flights:1,hhSize:4,house:2,heating:0,green:1,temp:1,screens:4,streaming:3,ai:10,secondhand:2,clothes:3,shoes:3,packages:3,drinks:5,cups:2,phone:2,beauty:2};
const PROFILES={
 influencer:{label:'The Influencer',over:{meatRed:10,meatOther:14,dairy:3,caffeine:3,takeout:5,carType:4,commute:5,commuteDist:8,weekendCar:8,sports:3,flights:4,house:3,heating:1,temp:3,screens:8,streaming:6,ai:80,secondhand:3,clothes:15,shoes:12,packages:12,drinks:20,cups:10,phone:0,beauty:8,pets:3}},
 athlete:{label:'The Athlete',over:{meatRed:8,meatOther:14,dairy:3,caffeine:2,takeout:4,foodWaste:1,carType:4,commute:5,commuteDist:10,weekendCar:10,sports:3,flights:2,house:3,temp:2,screens:2,streaming:2,ai:5,clothes:4,shoes:6,packages:4,drinks:20,cups:4,phone:1,pets:3}},
 gamer:{label:'The Gamer',over:{meatRed:2,meatOther:5,takeout:6,caffeine:3,carType:2,commute:2,commuteDist:5,weekendCar:1,sports:0,flights:0,temp:2,screens:10,streaming:6,ai:100,clothes:1,packages:8,drinks:15,cups:1,shoes:1,phone:0,beauty:0}},
 average:{label:'The Average Teen',over:{}},
 eco:{label:'The Eco-Teen',over:{meatRed:0,meatOther:2,dairy:0,caffeine:0,takeout:0,foodWaste:0,pets:0,carType:0,commute:0,weekendCar:0,sports:0,flights:0,house:0,heating:2,green:0,temp:0,screens:1,streaming:1,ai:5,secondhand:0,clothes:0,shoes:2,packages:0,drinks:0,cups:1,phone:3,beauty:1}}
};
// Shared baseline (kg): derived so the AVG profile equals TARGET_AVG_TONS.
const BASELINE=Math.max(0,TARGET_AVG_TONS*1000-modeled(AVG));

function compute(m){
 const rows=Q.filter(q=>m[q.id]!=null).map(q=>({q,kg:pts(q,m),text:ansText(q,m[q.id])}));
 const cats={},grp={you:0,home:0};CATS.forEach(c=>cats[c]=0);
 rows.forEach(r=>{cats[r.q.cat]+=r.kg;grp[r.q.grp]+=r.kg});
 const kg=BASELINE+rows.reduce((s,r)=>s+r.kg,0);
 return{rows,cats,grp,kg,tons:kg/1000,
  top:[...rows].sort((a,b)=>b.kg-a.kg).filter(r=>r.kg>0).slice(0,3),
  maxCat:Object.entries(cats).reduce((a,b)=>b[1]>a[1]?b:a)[0]};
}
const t1=n=>(Math.round(n*10)/10).toFixed(1);

// ═══ UI ═══════════════════════════════════════════════════════════════
const $c=document.getElementById('ca'),$bar=document.getElementById('bar'),$pc=document.getElementById('pc');
let step=-1,ans={},cuts=new Set(),cur=null;

function renderIntro(){
 step=-1;$pc.classList.add('hidden');
 const sp=Object.entries(PROFILES).map(([k,p])=>`<button onclick="runSample('${k}')" class="bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold py-2 px-3 rounded-lg border border-gray-200 text-sm">${p.label}</button>`).join('');
 $c.innerHTML=`<div class="fade-in text-center flex flex-col items-center py-2">
  <h2 class="font-serif text-3xl md:text-4xl text-gray-900 mb-6">Discover Your Impact</h2>
  <div class="bg-blue-50 border border-blue-100 rounded-2xl p-5 mb-8 text-left max-w-lg text-sm text-blue-800 leading-relaxed">
   <h4 class="font-bold text-blue-900 uppercase tracking-wider mb-1">ℹ️ The Shared Baseline</h4>
   Everyone starts with about <strong>${t1(BASELINE/1000)} tons</strong> of CO₂ per year. That covers things you share with everyone: the power grid, roads, schools, stores, hospitals, and products your family buys that this audit does not ask about. You can't change it alone, but voters, companies, and governments can.
  </div>
  <p class="text-sm text-gray-500 mb-6 max-w-lg">Answer honestly. If you aren't sure about a household question, make your best guess. This is an estimate, not a measurement.</p>
  <button onclick="startQuiz()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg text-lg mb-8">Start My Audit →</button>
  <div class="w-full pt-6 border-t border-gray-100"><p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-4">Or analyze a sample profile:</p><div class="flex flex-wrap gap-2 justify-center">${sp}</div></div></div>`;
}
// Timing instrumentation (teacher data only; never shown to students, never affects scoring)
let timing={},quizStart=null,tId=null,tStart=null,tabSwitches=0;
function tFlush(){try{if(tId!=null&&tStart!=null){const e=performance.now()-tStart;(timing[tId]=timing[tId]||{ms:0,visits:0,changes:0}).ms+=e;tStart=performance.now()}}catch(e){}}
function tStop(){try{tFlush();tId=null;tStart=null}catch(e){}}
function tBegin(id){try{if(tId===id&&tStart!=null)return;tFlush();tId=id;tStart=document.hidden?null:performance.now();const t=timing[id]=timing[id]||{ms:0,visits:0,changes:0};t.visits++}catch(e){}}
function tChange(id,v){try{if(ans[id]!=null&&ans[id]!==v){const t=timing[id]=timing[id]||{ms:0,visits:0,changes:0};t.changes++}}catch(e){}}
document.addEventListener('visibilitychange',()=>{try{if(tId==null)return;if(document.hidden){tFlush();tStart=null;tabSwitches++}else if(tStart==null)tStart=performance.now()}catch(e){}});
function startQuiz(){ans={};cuts=new Set();step=0;try{timing={};tabSwitches=0;tId=null;tStart=null;quizStart=performance.now()}catch(e){}$pc.classList.remove('hidden');renderQuestion()}
function runSample(k){ans={...AVG,...PROFILES[k].over};cuts=new Set();showResults(k)}

function impactText(q,v){const k=Math.round(q.f(v,ctx(ans)));return k===0?'Zero impact! 🌱':`≈ ${k.toLocaleString()} kg CO₂/yr`}
function renderQuestion(){
 const q=Q[step],a=ans[q.id];tBegin(q.id);$bar.style.width=((step+1)/Q.length*100)+'%';
 let inp;
 if(q.type==='options'){
  inp=`<div class="flex flex-col gap-3 mt-6">${q.texts.map((t,i)=>`<button onclick="pick(${i})" class="opt w-full text-left p-4 rounded-2xl border-2 ${a===i?'sel':'border-gray-200 bg-white'} flex items-center gap-4"><span class="text-xl w-8 text-center">${q.icon}</span><span class="font-medium ${a===i?'text-brand-800 font-bold':''}">${t}</span></button>`).join('')}</div>`;
 }else{
  const v=a??q.def;
  inp=`<div class="bg-brand-50 p-8 rounded-3xl border-2 border-brand-100 mt-6"><div class="text-center mb-8">
   <div class="font-serif text-6xl text-brand-700 mb-2" id="sv">${v}</div>
   <div class="text-sm font-semibold text-gray-500 uppercase tracking-widest">${q.unit}</div>
   <div class="inline-block bg-white px-4 py-1.5 rounded-full text-xs font-bold text-gray-600 mt-4 border border-gray-100" id="si">${a==null?'Move the slider to answer':impactText(q,v)}</div></div>
   <input type="range" min="${q.min}" max="${q.max}" step="1" value="${v}" oninput="onSlide(this.value)" onchange="onSlide(this.value)" aria-label="${q.title}">
   <div class="flex justify-between text-gray-400 text-xs font-bold mt-3"><span>${q.min}</span><span>${q.max}</span></div></div>`;
 }
 const last=Q.slice(step+1).every((_,i)=>skipped(step+1+i));
 $c.innerHTML=`<div class="fade-in flex flex-col h-full">
  <div class="flex items-center justify-between mb-4"><span class="bg-brand-100 text-brand-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${q.cat}</span><span class="text-gray-400 text-sm font-bold">${step+1} / ${Q.length}</span></div>
  <h2 class="font-serif text-2xl md:text-3xl text-gray-900 mb-3 leading-tight"><span class="text-3xl mr-2">${q.icon}</span>${q.title}</h2>
  <p class="text-gray-500">${q.desc}</p>
  <div class="flex-grow">${inp}</div>
  <div class="mt-8 pt-4 flex gap-4 items-center justify-between border-t border-gray-100">
   <div class="hidden md:block text-sm text-gray-500 bg-gray-50 px-4 py-2 rounded-lg border border-gray-100">Your footprint so far: <strong class="text-brand-600 text-lg" id="rt">${t1((BASELINE+modeled(ans))/1000)}</strong> tons</div>
   <div class="flex gap-3 w-full md:w-auto"><button onclick="prevQ()" class="px-6 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 ${step===0?'invisible':''}">Back</button>
   <button id="nb" onclick="nextQ()" class="flex-grow px-8 py-3 rounded-xl font-bold bg-brand-600 text-white hover:bg-brand-700 shadow-lg disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none disabled:cursor-not-allowed" ${a==null?'disabled':''}>${last?'See Results →':'Next →'}</button></div></div></div>`;
}
function onSlide(v){const q=Q[step];tChange(q.id,parseInt(v));ans[q.id]=parseInt(v);
 document.getElementById('sv').textContent=v;document.getElementById('si').textContent=impactText(q,+v);
 document.getElementById('rt').textContent=t1((BASELINE+modeled(ans))/1000);document.getElementById('nb').disabled=false}
function pick(i){tChange(Q[step].id,i);ans[Q[step].id]=i;renderQuestion()}
function prevQ(){let i=step-1;while(i>0&&skipped(i))i--;if(i>=0){tStop();step=i;renderQuestion()}}
function nextQ(){if(ans[Q[step].id]==null)return;let i=step+1;while(i<Q.length&&skipped(i))i++;if(i>=Q.length){tStop();return showResults('user')}tStop();step=i;renderQuestion()}

function showResults(type){
 tStop();
 $pc.classList.add('hidden');$c.scrollTop=0;cur=type;
 const r=compute(ans),t=r.tons,max=Math.max(t,TARGET_AVG_TONS)*1.05;
 const bar=(l,v,col,bold)=>`<div><div class="flex justify-between text-xs font-bold ${bold?'text-brand-700':'text-gray-500'} mb-1"><span>${l}</span><span>${t1(v)} tons</span></div><div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden"><div class="${col} h-3 rounded-full" style="width:${Math.min(100,v/max*100)}%"></div></div></div>`;
 const seg=(kg,col)=>`<div class="${col} h-4" style="width:${kg/r.kg/1+0*0>0?kg/r.kg*100:0}%"></div>`;
 const eq=(i,h,b)=>`<div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 flex gap-4 items-center"><div class="text-3xl">${i}</div><div><div class="text-xs font-bold uppercase tracking-wide">${h}</div><div class="text-sm text-gray-500">${b}</div></div></div>`;
 const badge=type==='user'?'':`<div class="inline-block bg-gray-100 text-gray-700 text-xs font-bold px-3 py-1 rounded-full mb-4">Sample profile: ${PROFILES[type].label}</div>`;
 const topHtml=r.top.map(x=>`<div class="flex items-center justify-between gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3"><div class="text-sm"><span class="text-xl mr-1">${x.q.icon}</span>${x.text} <span class="text-gray-400">· ${x.q.cat}</span></div><button id="cut-${x.q.id}" onclick="toggleCut('${x.q.id}')" class="shrink-0 text-xs font-bold px-3 py-2 rounded-lg border border-brand-600 text-brand-700 hover:bg-brand-50">Cut in half</button></div>`).join('');
 const actions=type==='user'
  ?`<button onclick="renderIntro()" class="sm:w-1/3 bg-white border-2 border-gray-200 text-gray-600 hover:bg-gray-50 font-bold py-4 rounded-xl">↺ Start Over</button><button id="sb" onclick="submitAudit()" class="sm:w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg text-lg">Submit Data to Teacher ✉️</button>`
  :`<button onclick="renderIntro()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 rounded-xl shadow-lg text-lg">▶ Do My Own Audit Now</button>`;
 $c.innerHTML=`<div class="fade-in pb-4">
  <div class="text-center mb-8 border-b border-gray-100 pb-8">${badge}
   <div class="font-serif text-7xl md:text-8xl text-brand-600 leading-none mb-2">${t1(t)}</div>
   <div class="text-gray-400 font-bold uppercase tracking-widest text-sm">Metric Tons of CO₂ / Year</div>
   <div class="text-gray-600 mt-3 text-sm">That is <b>${t1(t/GLOBAL_AVG_TONS)}×</b> the global average and <b>${t1(t/SUSTAINABLE_TONS)}×</b> a sustainable share.</div></div>

  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Who controls your footprint?</h3>
  <div class="flex rounded-full overflow-hidden mb-2">${seg(r.grp.you,'bg-brand-500')}${seg(r.grp.home,'bg-amber-400')}${seg(BASELINE,'bg-gray-400')}</div>
  <div class="flex flex-wrap gap-x-4 text-xs text-gray-500 mb-10"><span>🟢 Your choices: ${t1(r.grp.you/1000)} t</span><span>🟡 Your household's choices: ${t1(r.grp.home/1000)} t</span><span>⚪ Shared baseline: ${t1(BASELINE/1000)} t</span></div>

  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Global comparison</h3>
  <div class="space-y-4 mb-10">${bar('Sustainable share',SUSTAINABLE_TONS,'bg-brand-500')}${bar('Global average',GLOBAL_AVG_TONS,'bg-brand-400')}${bar('Typical American (all sources)',TARGET_AVG_TONS,'bg-amber-400')}${bar('You (this profile)',t,'bg-brand-700',1)}</div>

  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">What does ${t1(t)} tons equal?</h3>
  <div class="grid sm:grid-cols-2 gap-3 mb-10">${eq('🌳','Offset',`Takes about <b>${Math.round(t*46).toLocaleString()} mature trees</b> a year to absorb.`)}${eq('🚗','Driving',`Equals driving a gas car about <b>${Math.round(t*2480).toLocaleString()} miles</b>.`)}${eq('⛽','Gasoline',`Equals burning about <b>${Math.round(t*112).toLocaleString()} gallons</b> of gas.`)}${eq('🌍','Earths needed',`If everyone lived this way, we'd need about <b>${t1(t/SUSTAINABLE_TONS)} Earths</b>' worth of sustainable carbon budget.`)}</div>

  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Your biggest habits: what if you cut one in half?</h3>
  <div class="space-y-2 mb-3">${topHtml||'<p class="text-sm text-gray-500">No habits added emissions.</p>'}</div>
  <div id="wi" class="text-sm text-gray-600 bg-brand-50 border border-brand-100 rounded-xl p-3 mb-10">Pick a habit to see how much a change could save.</div>

  <div class="bg-gradient-to-br from-brand-800 to-brand-900 rounded-3xl p-6 md:p-8 text-white mb-8">
   <h3 class="font-serif text-2xl mb-2">✍️ For Your Reflection</h3>
   <p class="text-brand-100 text-sm mb-5">Your highest-emitting category is <strong class="text-white text-lg">${r.maxCat}</strong>${r.top[0]?`, and your biggest single habit is <strong class="text-white">${r.top[0].text}</strong>`:''}. Use these questions to guide your writing:</p>
   <ul class="space-y-2 text-sm text-brand-50 list-disc list-inside"><li>Why do you think <em>${r.maxCat}</em> is your biggest impact area?</li><li>Which answer surprised you most, and why?</li><li>Name one realistic habit you could change next month.</li><li>Which part of your footprint could you not change, and who could?</li></ul></div>
  <div id="msg" class="text-sm text-center mb-3 hidden"></div>
  <div class="flex flex-col sm:flex-row gap-3">${actions}</div></div>`;
}
function toggleCut(id){
 cuts.has(id)?cuts.delete(id):cuts.add(id);
 const r=compute(ans);let save=0;
 r.top.forEach(x=>{const on=cuts.has(x.q.id);if(on)save+=x.kg/2;const b=document.getElementById('cut-'+x.q.id);b.className=`shrink-0 text-xs font-bold px-3 py-2 rounded-lg border border-brand-600 ${on?'bg-brand-600 text-white':'text-brand-700 hover:bg-brand-50'}`});
 document.getElementById('wi').innerHTML=save?`Those changes would save about <b>${t1(save/1000)} tons</b> (${Math.round(save/r.kg*100)}% of your total). Your new total: <b>${t1((r.kg-save)/1000)} tons</b>. Notice how much stays the same without changes from companies and governments.`:'Pick a habit to see how much a change could save.';
}

// ═══ IteratED BRIDGE ══════════════════════════════════════════════════
function submitSimulation(simData=null){
 const message={action:'SIM_COMPLETE'};
 if(simData!==null&&simData!==undefined)message.simData=simData;
 window.parent.postMessage(message,PARENT_ORIGIN);
}
function qSec(id){try{const t=timing[id];return t?Math.round(t.ms/100)/10:0}catch(e){return 0}}
function timingData(){try{
 tStop();const d1=x=>Math.round(x*10)/10;
 const qt=Q.filter(q=>timing[q.id]).map(q=>({id:q.id,category:q.cat,seconds:qSec(q.id),visits:timing[q.id].visits,changes:timing[q.id].changes}));
 const s=qt.map(x=>x.seconds).sort((a,b)=>a-b),n=s.length;
 return{totalActiveSeconds:d1(qt.reduce((a,x)=>a+x.seconds,0)),totalElapsedSeconds:quizStart==null?0:d1((performance.now()-quizStart)/1000),
  medianSecondsPerQuestion:n?d1(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0,
  fastAnswerCount:qt.filter(x=>x.seconds<FAST_ANSWER_SECONDS).length,tabSwitches,questionTimes:qt}
}catch(e){return{}}}
function submitAudit(){
 const msg=document.getElementById('msg'),btn=document.getElementById('sb');
 msg.classList.remove('hidden');
 if(window.parent===window){msg.textContent='Preview mode: this page is not inside IteratED, so nothing was sent.';msg.className='text-sm text-center mb-3 text-amber-600';return}
 const r=compute(ans),tons=x=>Math.round(x/10)/100;
 const breakdown={};CATS.forEach(c=>breakdown[c]=tons(r.cats[c]));breakdown['Shared baseline']=tons(BASELINE);
 submitSimulation({
  simVersion:SIM_VERSION,
  carbonTons:Math.round(r.tons*10)/10,
  unit:'metric tons CO2e/year',
  highestCategory:r.maxCat,
  topHabit:r.top[0]?r.top[0].text:'',
  earthsNeeded:Math.round(r.tons/SUSTAINABLE_TONS*10)/10,
  categoryBreakdown:breakdown,
  profileUsed:'Self',
  dataTable:r.rows.map(x=>({category:x.q.cat,answer:x.text,kgCO2e:x.kg,timeSeconds:qSec(x.q.id)})),
  rawAnswers:ans,
  ...timingData()
 });
 btn.disabled=true;btn.textContent='Submitted ✓';btn.className='sm:w-2/3 bg-brand-600 text-white font-bold py-4 rounded-xl text-lg';
 msg.textContent='Data sent to your teacher. Record your results in your follow-up questions.';msg.className='text-sm text-center mb-3 text-brand-700';
}
renderIntro();
</script>
