// SCORE CALCULATION
// ══════════════════════════════════════════════════════
function calculateScore() {
    const ctx = buildCtx(questions.length - 1);
    let total = BASELINE;
    const cats = {Food:0, Transportation:0, 'Housing & Energy':0, Consumerism:0};
    const report = [];

    for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const ans = answers[i];
        if (ans === null) continue;
        
        const {pts, ansText} = scorePts(q, ans, ctx);
        total += pts;
        cats[q.category] = (cats[q.category] || 0) + pts;
        report.push({questionId:q.id, questionTitle:q.title, category:q.category, answerGiven:ansText, carbonLbsAdded:pts});
    }
    return {total: Math.max(total, 500), cats, report};
}

function getRunningTotal() {
    const ctx = buildCtx(step);
    let total = BASELINE;
    for (let i = 0; i <= step; i++) {
        const q = questions[i];
        const ans = answers[i];
        if (ans !== null) total += scorePts(q, ans, ctx).pts;
    }
    return (Math.max(total, 0) / 2000).toFixed(1);
}

function buildCtx(maxStep) {
    const ciIdx = questions.findIndex(q => q.id === 'qCommuteMethod');
    const ctIdx = questions.findIndex(q => q.id === 'qCarType');
    const commuteMethod = (maxStep >= ciIdx && answers[ciIdx] !== null) ? answers[ciIdx] : null;
    const carTypeAns    = (maxStep >= ctIdx && answers[ctIdx] !== null) ? answers[ctIdx] : null;
    const carScaleMap = {0:0.3, 1:0.5, 2:0.65, 3:1.0, 4:1.7};
    const carScale = carTypeAns !== null ? (carScaleMap[carTypeAns] ?? 1.0) : 1.0;
    return {commuteMethod, carScale};
}

function scorePts(q, ans, ctx) {
    let pts = 0, ansText = '';
    if (q.type === 'options') {
        pts = q.options[ans].value;
        ansText = q.options[ans].text;
    } else if (q.type === 'slider') {
        ansText = `${ans} ${q.unit}`;
        if (q.id === 'qCommuteDist') {
            const methodImpact = [0, 0.05, 0.25, 0.40, 0.55, 1.0];
            const cm = ctx.commuteMethod;
            const distScale = cm !== null ? (methodImpact[cm] ?? 1.0) : 1.0;
            pts = Math.round(ans * 320 * distScale * (cm >= 3 ? ctx.carScale : 1));
        } else if (q.id === 'qWeekendCar') {
            pts = Math.round(ans * q.multiplier * ctx.carScale);
        } else if (q.id === 'qCups') {
            pts = Math.max(0, (ans - 2)) * 20; // First 2 are free
        } else {
            pts = ans * q.multiplier;
        }
    }
    return {pts, ansText};
}

                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-4">Or analyze a sample profile:</p>
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="runSampleProfile('influencer')" class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold py-2 px-3 rounded-lg border border-purple-200 transition-colors text-sm"><i class="fa-solid fa-mobile-screen mr-1"></i> Influencer</button>
                    <button onclick="runSampleProfile('athlete')" class="bg-orange-50 hover:bg-orange-100 text-orange-700 font-semibold py-2 px-3 rounded-lg border border-orange-200 transition-colors text-sm"><i class="fa-solid fa-football mr-1"></i> Athlete</button>
                    <button onclick="runSampleProfile('gamer')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-2 px-3 rounded-lg border border-blue-200 transition-colors text-sm"><i class="fa-solid fa-gamepad mr-1"></i> Gamer</button>
                    <button onclick="runSampleProfile('average')" class="bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold py-2 px-3 rounded-lg border border-gray-200 transition-colors text-sm"><i class="fa-solid fa-user mr-1"></i> Average Teen</button>
                    <button onclick="runSampleProfile('eco')" class="bg-brand-50 hover:bg-brand-100 text-brand-700 font-semibold py-2 px-3 rounded-lg border border-brand-200 transition-colors text-sm"><i class="fa-solid fa-leaf mr-1"></i> Eco-Teen</button>
                </div>
            </div>
        </div>
    `;
}

function startQuiz() {
    step = 0;
    answers = new Array(questions.length).fill(null);
    questions.forEach((q, i) => { if (q.type === 'slider') answers[i] = q.default; });
    $progressContainer.classList.remove('hidden');
    renderQuestion();
}

function runSampleProfile(type) {
    if (type === 'influencer') answers = [...influencerProfile];
    else if (type === 'athlete') answers = [...athleteProfile];
    else if (type === 'gamer') answers = [...gamerProfile];
    else if (type === 'average') answers = [...averageProfile];
    else if (type === 'eco') answers = [...ecoProfile];
    
    renderResults(type);
}

// ══════════════════════════════════════════════════════
// RENDER: QUESTION
// ══════════════════════════════════════════════════════
function renderQuestion() {
    const q = questions[step];
    const pct = ((step + 1) / questions.length) * 100;
    $progressBar.style.width = `${pct}%`;

    const ans = answers[step];
    let inputHtml = '';

    if (q.type === 'options') {
        inputHtml = `<div class="flex flex-col gap-3 mt-6">
            ${q.options.map((opt, i) => `
                <button onclick="selectOption(${i})" class="option-card w-full text-left p-4 rounded-2xl border-2 ${ans === i ? 'selected' : 'border-gray-200 bg-white hover:bg-gray-50'} flex items-center gap-4">
                    <div class="w-8 h-8 flex items-center justify-center text-xl shrink-0 opacity-80">${q.icon}</div>
                    <span class="font-medium text-gray-800 ${ans === i ? 'text-brand-800 font-bold' : ''}">${opt.text}</span>
                </button>
            `).join('')}
        </div>`;
    } else {
        const val = (ans !== null ? ans : q.default);
        inputHtml = `
            <div class="bg-brand-50 p-8 rounded-3xl border-2 border-brand-100 mt-6 shadow-sm">
                <div class="text-center mb-8">
                    <div class="font-serif text-6xl text-brand-700 mb-2" id="sliderVal">${val}</div>
                    <div class="text-sm font-semibold text-gray-500 uppercase tracking-widest">${q.unit}</div>
                    <div class="inline-block bg-white px-4 py-1.5 rounded-full text-xs font-bold text-gray-600 mt-4 shadow-sm border border-gray-100" id="sliderImpact">
                        ${q.impactText(val)}
                    </div>
                </div>
                <input type="range" min="${q.min}" max="${q.max}" step="1" value="${val}" oninput="onSlider(this.value)">
                <div class="flex justify-between text-gray-400 text-xs font-bold mt-3">
                    <span>${q.min}</span><span>${q.max}</span>
                </div>
            </div>
        `;
    }

    const canGo = answers[step] !== null;
    const isLast = step === questions.length - 1;

    $contentArea.innerHTML = `
        <div class="fade-in flex flex-col h-full">
            <div class="flex items-center justify-between mb-4">
                <span class="bg-brand-100 text-brand-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${q.category}</span>
                <span class="text-gray-400 text-sm font-bold">${step + 1} / ${questions.length}</span>
            </div>
            
            <h2 class="font-serif text-2xl md:text-3xl text-gray-900 mb-3 leading-tight"><span class="text-3xl mr-2">${q.icon}</span> ${q.title}</h2>
            <p class="text-gray-500 text-base leading-relaxed">${q.desc}</p>
            
            <div class="flex-grow">${inputHtml}</div>

            <!-- Sticky Bottom Navigation -->
            <div class="mt-8 pt-4 flex flex-col sm:flex-row gap-4 items-center justify-between border-t border-gray-100">
                <div class="w-full sm:w-auto text-center sm:text-left text-sm text-gray-500 bg-gray-50 px-4 py-2 rounded-lg border border-gray-100 hidden md:block">
                    Your footprint so far: <strong class="text-brand-600 ml-1 text-lg" id="rtVal">${getRunningTotal()}</strong> tons
                </div>
                
                <div class="flex gap-3 w-full sm:w-auto">
                    <button onclick="prevQ()" class="px-6 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition-colors border border-transparent ${step === 0 ? 'invisible' : ''}">
                        Back
                    </button>
                    <button onclick="nextQ()" id="nextBtn" class="flex-grow sm:flex-grow-0 px-8 py-3 rounded-xl font-bold transition-all flex items-center justify-center gap-2 ${canGo ? 'bg-brand-600 text-white hover:bg-brand-700 shadow-lg hover:-translate-y-0.5' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}" ${!canGo ? 'disabled' : ''}>
                        ${isLast ? 'See Results' : 'Next'} <i class="fa-solid ${isLast ? 'fa-chart-pie' : 'fa-arrow-right'}"></i>
                    </button>
                </div>
            </div>
        </div>
    `;
}

function onSlider(val) {
    answers[step] = parseInt(val);
    document.getElementById('sliderVal').textContent = val;
    document.getElementById('sliderImpact').textContent = questions[step].impactText(parseInt(val));
    document.getElementById('rtVal').textContent = getRunningTotal();
    const btn = document.getElementById('nextBtn');
    if (btn) {
        btn.disabled = false;
        btn.classList.replace('bg-gray-200', 'bg-brand-600');
        btn.classList.replace('text-gray-400', 'text-white');
        btn.classList.remove('cursor-not-allowed');
        btn.classList.add('hover:bg-brand-700', 'shadow-lg', 'hover:-translate-y-0.5');
    }
}

function selectOption(i) { answers[step] = i; renderQuestion(); }
function prevQ() { if (step > 0) { step--; renderQuestion(); } }
function nextQ() {
    if (answers[step] === null) return;
    if (step < questions.length - 1) { step++; renderQuestion(); }
    else renderResults('user');
}

// ══════════════════════════════════════════════════════
// RENDER: RESULTS
// ══════════════════════════════════════════════════════
function renderResults(profileType) {
    $progressContainer.classList.add('hidden');
    $contentArea.scrollTop = 0;

    const {total, cats, report} = calculateScore();
    const tons = parseFloat((total / 2000).toFixed(1));
    const maxCat = Object.entries(cats).reduce((a, b) => b[1] > a[1] ? b : a)[0];
    const scaleMax = Math.max(tons, 20);

    const globalPct = Math.min(100, (4.5 / scaleMax * 100)).toFixed(1);
    const usPct     = Math.min(100, (15 / scaleMax * 100)).toFixed(1);
    const userPct   = Math.min(100, (tons / scaleMax * 100)).toFixed(1);
    
    // Striking stats
    const earths    = (tons / 4.5).toFixed(1);
    const trees     = Math.round(tons * 41).toLocaleString();
    const carMiles  = Math.round(tons * 2481).toLocaleString();
    const sharks    = Math.max(1, Math.round(tons * 0.44)).toLocaleString();

    let scoreColor = 'text-brand-600';
    let barColor = 'bg-brand-500';
    let scoreMood = 'Below average — strong habits! 🌱';
    if (tons >= 8 && tons < 14) {
        scoreColor = 'text-amber-500'; barColor = 'bg-amber-400'; scoreMood = 'Around the US teen average 🌎';
    } else if (tons >= 14) {
        scoreColor = 'text-red-500'; barColor = 'bg-red-500'; scoreMood = 'Above average — big room to improve ⚠️';
    }

    const badgeMap = {
        'influencer': '<div class="inline-block bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full mb-4"><i class="fa-solid fa-mobile-screen mr-1"></i> Profile: The Influencer</div>',
        'athlete': '<div class="inline-block bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full mb-4"><i class="fa-solid fa-football mr-1"></i> Profile: The Athlete</div>',
        'gamer': '<div class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full mb-4"><i class="fa-solid fa-gamepad mr-1"></i> Profile: The Gamer</div>',
        'average': '<div class="inline-block bg-gray-100 text-gray-700 text-xs font-bold px-3 py-1 rounded-full mb-4"><i class="fa-solid fa-user mr-1"></i> Profile: The Average Teen</div>',
        'eco': '<div class="inline-block bg-brand-100 text-brand-700 text-xs font-bold px-3 py-1 rounded-full mb-4"><i class="fa-solid fa-leaf mr-1"></i> Profile: The Eco-Teen</div>'
    };
    const badge = badgeMap[profileType] || '';

    let actionButtonsHtml = '';
    if (profileType === 'user') {
        actionButtonsHtml = `
            <button onclick="renderIntro()" class="sm:w-1/3 bg-white border-2 border-gray-200 text-gray-600 hover:bg-gray-50 hover:border-gray-300 font-bold py-4 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> Start Over
            </button>
            <button onclick="submitToLMS('${profileType}')" id="submitBtn" class="sm:w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 text-lg">
                Submit Data to Teacher <i class="fa-solid fa-paper-plane"></i>
            </button>
        `;
    } else {
        actionButtonsHtml = `
            <button onclick="renderIntro()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> Do My Own Audit Now
            </button>
        `;
    }

    $contentArea.innerHTML = `
        <div class="fade-in pb-4">
            <div class="text-center mb-8 border-b border-gray-100 pb-8">
                ${badge}
                <div class="font-serif text-7xl md:text-8xl ${scoreColor} leading-none tracking-tight mb-2">${tons}</div>
                <div class="text-gray-400 font-bold uppercase tracking-widest text-sm">Tons of CO₂ / Year</div>
                <div class="text-gray-600 font-medium mt-3">${scoreMood}</div>
            </div>

            <!-- Comparison -->
            <div class="mb-10">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-bar"></i> Global Comparison</h3>
                
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                            <span>Global Target (Sustainability)</span><span>4.5 Tons</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner"><div class="bg-brand-400 h-3 rounded-full" style="width:${globalPct}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                            <span>Average US Teen</span><span>~15.0 Tons</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner"><div class="bg-amber-400 h-3 rounded-full" style="width:${usPct}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-bold ${scoreColor} mb-1">
                            <span>You (This Profile)</span><span>${tons} Tons</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner"><div class="${barColor} h-3 rounded-full" style="width:${userPct}%"></div></div>
                    </div>
                </div>
            </div>

            <!-- Equivalencies -->
            <div class="mb-10">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">What does ${tons} tons equal?</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 flex gap-4 items-center">
                        <div class="text-3xl">🦈</div>
                        <div>
                            <div class="text-xs font-bold text-gray-800 uppercase tracking-wide">Weight</div>
                            <div class="text-sm text-gray-500 mt-0.5">Weighs as much as <b>${sharks} Great White Sharks</b>.</div>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 flex gap-4 items-center">
                        <div class="text-3xl">🌳</div>
                        <div>
                            <div class="text-xs font-bold text-gray-800 uppercase tracking-wide">Offset</div>
                            <div class="text-sm text-gray-500 mt-0.5">Takes <b>${trees} mature trees</b> a year to absorb.</div>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 flex gap-4 items-center">
                        <div class="text-3xl">🚗</div>
                        <div>
                            <div class="text-xs font-bold text-gray-800 uppercase tracking-wide">Driving</div>
                            <div class="text-sm text-gray-500 mt-0.5">Equals driving a gas car <b>${carMiles} miles</b>.</div>
                        </div>
                    </div>
                    <div class="bg-blue-50 rounded-2xl p-4 border border-blue-100 flex gap-4 items-center">
                        <div class="text-3xl">🌍</div>
                        <div>
                            <div class="text-xs font-bold text-blue-900 uppercase tracking-wide">Earths Needed</div>
                            <div class="text-sm text-blue-700 mt-0.5">If everyone lived this way, we'd need <b>${earths} Earths</b>.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reflection Prep -->
            <div class="bg-gradient-to-br from-brand-800 to-brand-900 rounded-3xl p-6 md:p-8 text-white mb-8 shadow-xl">
                <h3 class="font-serif text-2xl mb-2 flex items-center gap-3"><i class="fa-solid fa-pen-nib"></i> For Your Reflection</h3>
                <p class="text-brand-100 text-sm mb-5 leading-relaxed">Your highest-emitting category is <strong class="text-white text-lg ml-1">${maxCat}</strong>. Note this down! Use these questions to guide your writing:</p>
                <ul class="space-y-2 text-sm text-brand-50 list-disc list-inside opacity-90">
                    <li>Why do you think <em>${maxCat}</em> is your biggest impact area?</li>
                    <li>Which specific answer surprised you the most, and why?</li>
                    <li>Name one realistic habit you could change next month.</li>
                    <li>Why is reducing a personal footprint difficult?</li>
                </ul>
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3 mt-8">
                ${actionButtonsHtml}
            </div>
        </div>
    `;
}

// ══════════════════════════════════════════════════════
// LMS SUBMISSION
// ══════════════════════════════════════════════════════
function submitToLMS(profileType) {
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = `Submitting... <i class="fa-solid fa-spinner fa-spin"></i>`;
    btn.classList.replace('bg-blue-600', 'bg-blue-400');
    btn.disabled = true;

    const {total, cats, report} = calculateScore();
    const tonsCO2 = parseFloat((total / 2000).toFixed(1));
    const highestCategory = Object.entries(cats).reduce((a, b) => b[1] > a[1] ? b : a)[0];

    const payload = {
        action: 'SIM_COMPLETE',
        simData: {
            carbonTons: tonsCO2,
            highestCategory,
            categoryBreakdown: Object.fromEntries(
                Object.entries(cats).map(([k, v]) => [k, parseFloat((v / 2000).toFixed(2))])
            ),
            profileUsed: profileType === 'user' ? 'Self' : profileType,
            detailedAnswers: report,
            rawAnswerIndices: answers
        }
    };
    
    // Post to parent LMS window
    window.parent.postMessage(payload, '*');

    setTimeout(() => {
        btn.innerHTML = `Submitted Successfully! <i class="fa-solid fa-check"></i>`;
        btn.classList.replace('bg-blue-400', 'bg-brand-600');
        btn.classList.remove('hover:-translate-y-0.5');
    }, 800);
}

// Boot
renderIntro();
</script>
</body>
</html>
